<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Qora Quti</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #0f1012);
    --bg2: var(--tg-theme-secondary-bg-color, #17181b);
    --card: var(--tg-theme-section-bg-color, #1c1d21);
    --text: var(--tg-theme-text-color, #ececee);
    --hint: var(--tg-theme-hint-color, #8b8d94);
    --link: var(--tg-theme-link-color, #ff8a2a);
    --accent: #ff7a1a;
    --accent-soft: rgba(255, 122, 26, .14);
    --line: rgba(127, 127, 127, .18);
    --ok: #35c46a; --warn: #f0a020; --bad: #e5484d;
    --r: 14px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body { font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; padding-bottom: env(safe-area-inset-bottom); }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 0 12px calc(96px + env(safe-area-inset-bottom)); }

  header { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 12px 0 8px; }
  .top { display: flex; align-items: center; gap: 10px; }
  .logo { width: 30px; height: 30px; border-radius: 8px; background: #111; border: 2px solid var(--accent); display: grid; place-items: center; flex: none; }
  .logo i { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 10px var(--accent); }
  .brand { font-weight: 700; font-size: 17px; letter-spacing: .2px; }
  .usage { margin-left: auto; text-align: right; font-size: 12px; color: var(--hint); }
  .bar { width: 96px; height: 4px; border-radius: 4px; background: var(--line); margin-top: 3px; overflow: hidden; }
  .bar b { display: block; height: 100%; background: var(--accent); width: 0; }
  .icon-btn { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: var(--bg2); flex: none; }

  .search { margin-top: 10px; position: relative; }
  .search input { width: 100%; padding: 10px 12px 10px 36px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg2); color: var(--text); font: inherit; outline: none; }
  .search input:focus { border-color: var(--accent); }
  .search svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); opacity: .55; }
  .chips { display: flex; gap: 6px; overflow-x: auto; margin-top: 10px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; padding: 6px 12px; border-radius: 999px; background: var(--bg2); font-size: 13px; white-space: nowrap; display: flex; align-items: center; gap: 6px; }
  .chip.on { background: var(--accent); color: #111; font-weight: 600; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--hint); }
  .dot.active { background: var(--ok); } .dot.paused, .dot.over_quota { background: var(--warn); } .dot.bot_removed { background: var(--bad); }

  .feed { display: flex; flex-direction: column; gap: 10px; margin-top: 6px; }
  .post { background: var(--card); border-radius: var(--r); padding: 12px 12px 10px; border: 1px solid var(--line); }
  .meta { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--hint); margin-bottom: 6px; flex-wrap: wrap; }
  .meta .ch { color: var(--text); font-weight: 600; font-size: 13px; }
  .badge { font-size: 11px; padding: 2px 7px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }
  .badge.btn { cursor: pointer; }
  .fwd { font-size: 12px; color: var(--hint); margin-bottom: 4px; }
  .text { white-space: pre-wrap; word-wrap: break-word; overflow-wrap: anywhere; }
  .text a { color: var(--link); text-decoration: none; }
  .text code { font-family: ui-monospace, Menlo, monospace; font-size: 13px; background: var(--bg2); padding: 1px 4px; border-radius: 4px; }
  .text pre { font-family: ui-monospace, Menlo, monospace; font-size: 13px; background: var(--bg2); padding: 8px; border-radius: 8px; overflow-x: auto; margin: 4px 0; white-space: pre; }
  .text .spoiler { background: var(--hint); color: transparent; border-radius: 3px; cursor: pointer; }
  .text .spoiler.open { background: none; color: inherit; }
  .text blockquote { margin: 4px 0; padding-left: 10px; border-left: 3px solid var(--accent); }

  .media { display: grid; gap: 4px; margin: 8px 0 4px; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
  .media.one { grid-template-columns: 1fr; }
  .m { position: relative; border-radius: 10px; overflow: hidden; background: var(--bg2); min-height: 120px; display: grid; place-items: center; text-align: center; font-size: 13px; color: var(--hint); }
  .m img, .m video { width: 100%; height: 100%; max-height: 420px; object-fit: cover; display: block; }
  .media.one .m img, .media.one .m video { object-fit: contain; background: #000; }
  .m .act { padding: 14px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .m .act b { color: var(--text); font-weight: 600; }
  .m.file { min-height: 0; grid-template-columns: auto 1fr auto; display: grid; text-align: left; padding: 10px 12px; gap: 10px; place-items: center start; }
  .m.file .ico { width: 36px; height: 36px; border-radius: 9px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-size: 16px; }
  .m.file .nm { color: var(--text); font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
  .m.file .sz { font-size: 12px; }
  .m audio { width: 100%; }
  .pill { font-size: 12px; padding: 5px 10px; border-radius: 999px; background: var(--accent); color: #111; font-weight: 600; }
  .note { font-size: 12px; color: var(--hint); }

  .foot { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; font-size: 12px; color: var(--hint); }
  .foot button { color: var(--link); font-size: 13px; }

  .more { display: block; margin: 14px auto 0; padding: 10px 18px; border-radius: 12px; background: var(--bg2); font-size: 14px; }
  .empty { text-align: center; padding: 40px 16px; color: var(--hint); }
  .empty h2 { color: var(--text); font-size: 18px; margin: 12px 0 6px; }
  .empty ol { text-align: left; display: inline-block; margin: 10px 0 16px; padding-left: 18px; }
  .cta { display: inline-block; padding: 12px 20px; border-radius: 12px; background: var(--accent); color: #111; font-weight: 700; }
  .skel { height: 92px; border-radius: var(--r); background: linear-gradient(90deg, var(--bg2), var(--card), var(--bg2)); background-size: 200% 100%; animation: sk 1.2s infinite; }
  @keyframes sk { to { background-position: -200% 0; } }

  .sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 20; display: none; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; background: var(--bg); border-radius: 18px 18px 0 0; max-height: 82vh; overflow-y: auto; padding: 8px 16px calc(20px + env(safe-area-inset-bottom)); transform: translateY(100%); transition: transform .22s ease; }
  .sheet { visibility: hidden; } .sheet.open { transform: none; visibility: visible; } .sheet-bg.open { display: block; }
  .grab { width: 40px; height: 4px; border-radius: 4px; background: var(--line); margin: 4px auto 12px; }
  .sheet h3 { margin: 0 0 12px; font-size: 17px; }
  .ver { border-left: 3px solid var(--line); padding: 2px 0 2px 10px; margin-bottom: 14px; }
  .ver.cur { border-color: var(--accent); }
  .ver .when { font-size: 12px; color: var(--hint); margin-bottom: 4px; }
  .row { display: flex; align-items: center; gap: 10px; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .row .grow { flex: 1; min-width: 0; }
  .row .t { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .s { font-size: 12px; color: var(--hint); }
  .sbtn { font-size: 13px; padding: 7px 12px; border-radius: 10px; background: var(--bg2); }
  .toast { position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: #222; color: #fff; padding: 9px 14px; border-radius: 10px; font-size: 13px; z-index: 30; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: 90vw; }
  .toast.show { opacity: 1; }

  /* ---------------- tablar va seyf */
  [hidden] { display: none !important; }
  .nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: var(--bg2); border-top: 1px solid var(--line); display: flex; padding-bottom: env(safe-area-inset-bottom); }
  .nav button { flex: 1; padding: 8px 0 10px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; color: var(--hint); }
  .nav button .i { font-size: 20px; line-height: 1.1; }
  .nav button.on { color: var(--accent); font-weight: 600; }
  .inp { width: 100%; padding: 11px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg2); color: var(--text); font: inherit; outline: none; }
  textarea.inp { min-height: 84px; resize: vertical; }
  .inp:focus { border-color: var(--accent); }
  .inp.mono, .mono { font-family: ui-monospace, Menlo, monospace; font-size: 14px; }
  .btn { display: block; width: 100%; padding: 13px; border-radius: 12px; background: var(--accent); color: #111; font-weight: 700; text-align: center; margin-top: 10px; }
  .btn.sec { background: var(--bg2); color: var(--text); font-weight: 600; }
  .btn.danger { background: rgba(229, 72, 77, .14); color: var(--bad); font-weight: 600; }
  .btn:disabled { opacity: .55; }
  .lockbox { text-align: center; padding: 28px 6px 10px; }
  .lockbox .big { font-size: 46px; }
  .lockbox h2 { margin: 10px 0 6px; font-size: 20px; }
  .lockbox p { color: var(--hint); margin: 0 0 16px; }
  .rk { font-family: ui-monospace, Menlo, monospace; font-size: 17px; letter-spacing: .5px; background: var(--bg2); padding: 14px; border-radius: 12px; word-break: break-all; text-align: center; user-select: all; -webkit-user-select: all; border: 1px dashed var(--accent); }
  .list { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
  .item { display: flex; align-items: center; gap: 12px; padding: 12px; background: var(--card); border: 1px solid var(--line); border-radius: var(--r); text-align: left; width: 100%; }
  .item .ic { width: 40px; height: 40px; border-radius: 11px; background: var(--accent-soft); display: grid; place-items: center; font-size: 19px; flex: none; }
  .item .grow { flex: 1; min-width: 0; }
  .item .t { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .s { font-size: 12px; color: var(--hint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fab { position: fixed; right: 16px; bottom: calc(76px + env(safe-area-inset-bottom)); width: 56px; height: 56px; border-radius: 50%; background: var(--accent); color: #111; font-size: 30px; line-height: 1; box-shadow: 0 6px 18px rgba(0,0,0,.35); z-index: 9; }
  .fld { margin-bottom: 12px; }
  .fld .lbl { font-size: 12px; color: var(--hint); margin-bottom: 4px; display: flex; justify-content: space-between; align-items: center; }
  .vf { display: flex; align-items: flex-start; gap: 8px; padding: 10px 12px; background: var(--bg2); border-radius: 12px; margin-bottom: 8px; }
  .vf .grow { flex: 1; min-width: 0; }
  .vf .lbl { font-size: 12px; color: var(--hint); }
  .vf .val { word-break: break-all; white-space: pre-wrap; }
  .vf .acts { display: flex; gap: 6px; flex: none; }
  .mini { font-size: 12px; padding: 6px 10px; border-radius: 9px; background: var(--card); white-space: nowrap; }
  .typegrid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .typegrid button { padding: 14px 12px; border-radius: 12px; background: var(--bg2); text-align: left; display: flex; gap: 10px; align-items: center; font-size: 14px; }
  .typegrid button span { font-size: 20px; }
  .progress { height: 6px; border-radius: 6px; background: var(--line); overflow: hidden; margin-top: 8px; }
  .progress b { display: block; height: 100%; background: var(--accent); width: 0; transition: width .2s; }
  .warn { background: rgba(240, 160, 32, .12); border: 1px solid rgba(240, 160, 32, .35); padding: 10px 12px; border-radius: 12px; font-size: 13px; text-align: left; }
  .info { background: var(--bg2); padding: 10px 12px; border-radius: 12px; font-size: 13px; color: var(--hint); }
  .strength { height: 4px; border-radius: 4px; background: var(--line); margin-top: 6px; overflow: hidden; }
  .strength b { display: block; height: 100%; width: 0; transition: width .2s, background .2s; }
  .bar2 { display: flex; gap: 8px; align-items: center; margin-top: 4px; }
  .bar2 .inp { flex: 1; }
  .preview img, .preview video { width: 100%; border-radius: 12px; max-height: 60vh; object-fit: contain; background: #000; }
  .preview pre { white-space: pre-wrap; background: var(--bg2); padding: 10px; border-radius: 10px; max-height: 50vh; overflow: auto; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="top">
      <div class="logo"><i></i></div>
      <div class="brand">Qora Quti</div>
      <div class="usage" id="usage"></div>
      <button class="icon-btn" id="btnSettings" aria-label="Sozlamalar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
    </div>
    <div id="chTools" hidden>
    <div class="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Arxivdan qidiriş…" autocomplete="off" enterkeyhint="search">
    </div>
    <div class="chips" id="chips"></div>
    </div>
  </header>
  <section id="tabVault"></section>
  <section id="tabFiles" hidden></section>
  <section id="tabChannels" hidden>
    <main class="feed" id="feed"></main>
    <button class="more" id="more" hidden>Yana yuklaş</button>
  </section>
</div>
<button class="fab" id="fab" hidden aria-label="Qöşiş">+</button>
<input type="file" id="filePick" multiple hidden>
<nav class="nav" id="nav">
  <button data-tab="vault" class="on"><span class="i">🔐</span>Seyf</button>
  <button data-tab="files"><span class="i">📁</span>Fayllar</button>
  <button data-tab="channels"><span class="i">📢</span>Kanallar</button>
</nav>

<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet"><div class="grab"></div><div id="sheetBody"></div></div>
<div class="toast" id="toast"></div>
<div id="shield" hidden style="position:fixed;inset:0;z-index:50;background:var(--bg);display:grid;place-items:center;font-size:48px">🔒</div>

<script>
(() => {
  const API = "https://zupzvekirthvknydjjga.supabase.co/functions/v1/qq-bot/api";
  const tg = window.Telegram && window.Telegram.WebApp;
  const initData = tg ? tg.initData : "";
  const $ = (id) => document.getElementById(id);
  const MONTHS = ["yanvar", "fevral", "mart", "aprel", "may", "iyun", "iyul", "avgust", "sentyabr", "oktyabr", "noyabr", "dekabr"];
  const STATUS = { active: "yozilmoqda", paused: "töxtatilgan", over_quota: "limitdan taşqari", bot_removed: "bot olib taşlangan" };

  const state = { me: null, channel: null, q: "", next: null, loading: false, posts: [] };

  if (tg) {
    tg.ready();
    tg.expand();
    try { tg.setHeaderColor("bg_color"); } catch (_) {}
  }

  // ------------------------------------------------------------ yordamchilar
  function el(tag, attrs, ...kids) {
    const n = document.createElement(tag);
    if (attrs) for (const [k, v] of Object.entries(attrs)) {
      if (v == null || v === false) continue;
      if (k === "class") n.className = v;
      else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, v === true ? "" : v);
    }
    for (const c of kids.flat()) if (c != null && c !== false) n.append(c.nodeType ? c : String(c));
    return n;
  }
  function toast(msg) {
    const t = $("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toast._t);
    toast._t = setTimeout(() => t.classList.remove("show"), 2200);
  }
  function fmtBytes(n) {
    if (!n || n < 1024) return (n || 0) + " B";
    const u = ["KB", "MB", "GB", "TB"]; let v = n / 1024, i = 0;
    while (v >= 1024 && i < u.length - 1) { v /= 1024; i++; }
    return (v < 10 ? v.toFixed(1) : Math.round(v)) + " " + u[i];
  }
  function fmtDate(iso) {
    const d = new Date(iso);
    const p = new Intl.DateTimeFormat("en-GB", { timeZone: "Asia/Tashkent", year: "numeric", month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit", hourCycle: "h23" })
      .formatToParts(d).reduce((a, x) => (a[x.type] = x.value, a), {});
    const now = new Date();
    const sameYear = String(now.getFullYear()) === p.year;
    return `${Number(p.day)}-${MONTHS[Number(p.month) - 1]}${sameYear ? "" : " " + p.year}, ${p.hour}:${p.minute}`;
  }
  function fmtDur(s) {
    if (!s) return "";
    const m = Math.floor(s / 60), r = s % 60;
    return `${m}:${String(r).padStart(2, "0")}`;
  }
  function openLink(url) {
    if (tg && /^https:\/\/t\.me\//.test(url)) tg.openTelegramLink(url);
    else if (tg) tg.openLink(url);
    else window.open(url, "_blank", "noopener");
  }

  async function api(path, opts = {}) {
    const res = await fetch(API + path, {
      method: opts.method || "GET",
      headers: { Authorization: "tma " + initData, ...(opts.body ? { "Content-Type": "application/json" } : {}) },
      body: opts.body ? JSON.stringify(opts.body) : undefined,
    });
    let data = null;
    try { data = await res.json(); } catch (_) {}
    if (!res.ok) { const e = new Error((data && data.error) || "HTTP " + res.status); e.status = res.status; e.data = data; throw e; }
    return data;
  }

  // ------------------------------------------------------------ Telegram formatlash (entities)
  // Ofsetlar UTF-16 birliklarda — JS satrlari ham UTF-16, shuning uchun to'g'ridan-to'g'ri kesamiz.
  function renderText(text, entities) {
    const root = el("div", { class: "text" });
    if (!text) return root;
    const ents = (entities || []).filter((e) => e && e.length > 0 && e.offset >= 0 && e.offset + e.length <= text.length);
    const points = new Set([0, text.length]);
    for (const e of ents) { points.add(e.offset); points.add(e.offset + e.length); }
    const cuts = [...points].sort((a, b) => a - b);
    for (let i = 0; i < cuts.length - 1; i++) {
      const a = cuts[i], b = cuts[i + 1];
      const piece = text.slice(a, b);
      const active = ents.filter((e) => e.offset <= a && e.offset + e.length >= b).sort((x, y) => y.length - x.length);
      let node = document.createTextNode(piece);
      for (const e of active.reverse()) node = wrap(e, node, piece);
      root.append(node);
    }
    return root;
  }
  function safeUrl(u) {
    try { const x = new URL(u); return /^(https?|tg):$/.test(x.protocol) ? x.href : null; } catch (_) { return null; }
  }
  function wrap(e, inner, piece) {
    const t = e.type;
    if (t === "bold") return el("b", null, inner);
    if (t === "italic") return el("i", null, inner);
    if (t === "underline") return el("u", null, inner);
    if (t === "strikethrough") return el("s", null, inner);
    if (t === "code") return el("code", null, inner);
    if (t === "pre") return el("pre", null, inner);
    if (t === "blockquote" || t === "expandable_blockquote") return el("blockquote", null, inner);
    if (t === "spoiler") { const s = el("span", { class: "spoiler" }, inner); s.onclick = () => s.classList.add("open"); return s; }
    if (t === "text_link" || t === "url") {
      const href = safeUrl(t === "url" ? (/^https?:/i.test(piece) ? piece : "https://" + piece) : e.url);
      if (!href) return inner;
      return el("a", { href, onclick: (ev) => { ev.preventDefault(); openLink(href); } }, inner);
    }
    if (t === "mention") {
      const href = "https://t.me/" + piece.replace(/^@/, "");
      return el("a", { href, onclick: (ev) => { ev.preventDefault(); openLink(href); } }, inner);
    }
    return inner;
  }

  // ------------------------------------------------------------ media
  const KIND_ICON = { document: "📄", audio: "🎵", voice: "🎙", video: "🎬", animation: "🎞", video_note: "⭕️", photo: "🖼" };
  const MSTATUS = {
    pending: "Arxivga yuklanmoqda…",

  const urlCache = new Map();
  async function mediaUrl(id, download) {
    const key = id + (download ? ":d" : "");
    const c = urlCache.get(key);
    if (c && c.exp > Date.now()) return c.url;
    const r = await api(`/media?id=${encodeURIComponent(id)}${download ? "&download=1" : ""}`);
    urlCache.set(key, { url: r.url, exp: Date.now() + (r.expires_in - 60) * 1000 });
    return r.url;
  }

  function groupPosts(posts) {
    const out = [];
    for (const p of posts) {
      const last = out[out.length - 1];
      if (last && p.media_group_id && last.media_group_id === p.media_group_id && last.channel_id === p.channel_id) {
        last.media = [...p.media, ...last.media];
        if (!last.text && p.text) { last.text = p.text; last.entities = p.entities; }
        last.edit_count += p.edit_count;
        last.parts.push(p);

  // ============================================================ SEYF (telefonda shifrlash)
  // Kalit tuzilmasi: tasodifiy 256-bit DEK yozuv va fayllarni shifrlaydi. DEK serverga faqat o'ralgan holda boradi:
  //   wrapped_key          = AES-GCM(KEK = PBKDF2-SHA256(master parol, salt, 600 000), DEK)
  //   recovery_wrapped_key = AES-GCM(PBKDF2-SHA256(tiklash kaliti, recovery_salt, 600 000), DEK)
  // Server, admin yoki Supabase ochiq parolni ham, DEK'ni ham ko'rmaydi.
  const te = new TextEncoder(), td = new TextDecoder();
  const ITER = 600000;
  const AUTOLOCK_MS = 5 * 60 * 1000;
  const CHUNK = 4 * 1024 * 1024;
  const B64 = {
    enc(u8) { let s = ""; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); },
    dec(s) { const b = atob(s); const u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; },
  };
  const rand = (n) => crypto.getRandomValues(new Uint8Array(n));
  async function kdf(secret, saltB64, iterations) {
    const base = await crypto.subtle.importKey("raw", te.encode(secret), "PBKDF2", false, ["deriveKey"]);
    return crypto.subtle.deriveKey({ name: "PBKDF2", hash: "SHA-256", salt: B64.dec(saltB64), iterations }, base, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
  }
  async function seal(key, plain, aad) {
    const iv = rand(12);
    const ct = new Uint8Array(await crypto.subtle.encrypt({ name: "AES-GCM", iv, additionalData: te.encode(aad) }, key, plain));
    const out = new Uint8Array(12 + ct.length); out.set(iv); out.set(ct, 12);
    return out;
  }
  async function unseal(key, box, aad) {
    return new Uint8Array(await crypto.subtle.decrypt({ name: "AES-GCM", iv: box.subarray(0, 12), additionalData: te.encode(aad) }, key, box.subarray(12)));
  }
  const importDek = (raw) => crypto.subtle.importKey("raw", raw, { name: "AES-GCM" }, false, ["encrypt", "decrypt"]);
  const RK_ABC = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  function newRecoveryKey() {
    let bits = 0, val = 0, out = "";
    for (const b of rand(20)) { val = ((val << 8) | b) & 0xffff; bits += 8; while (bits >= 5) { out += RK_ABC[(val >>> (bits - 5)) & 31]; bits -= 5; } }
    return out.match(/.{4}/g).join("-");
  }
  const normRK = (s) => String(s || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
  const toHex = (u8) => [...u8].map((b) => b.toString(16).padStart(2, "0")).join("");
  // Akkaunt yo'qolsa ko'chirish uchun: tiklash kalitidan alohida "ko'chirish tokeni" chiqariladi.
  // Server faqat uning SHA-256 xeshini saqlaydi; token faqat tiklash paytida yuboriladi.
  async function transferToken(rk) {
    const base = await crypto.subtle.importKey("raw", te.encode(normRK(rk)), "PBKDF2", false, ["deriveBits"]);
    const bits = await crypto.subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt: te.encode("qq-transfer-v1"), iterations: 100000 }, base, 256);
    return toHex(new Uint8Array(bits));
  }
  async function transferHash(rk) {
    return toHex(new Uint8Array(await crypto.subtle.digest("SHA-256", te.encode(await transferToken(rk)))));
  }

  function strength(pw) {
    let s = 0;
    if (pw.length >= 10) s++; if (pw.length >= 14) s++; if (pw.length >= 18) s++;
    if (/[a-z]/.test(pw) && /[A-Z]/.test(pw)) s++; if (/\d/.test(pw)) s++; if (/[^A-Za-z0-9]/.test(pw)) s++;
    return Math.min(4, Math.floor(s * 4 / 6));
  }
  function genPassword(n = 20) {
    const abc = "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789!@#$%^&*-_=+?";
    const out = []; const r = new Uint32Array(n); crypto.getRandomValues(r);
    for (let i = 0; i < n; i++) out.push(abc[r[i] % abc.length]);
    return out.join("");
  }

  async function createVault(password) {
    const dekRaw = rand(32);
    const salt = B64.enc(rand(16)), rsalt = B64.enc(rand(16));
    const rk = newRecoveryKey();
    const kek = await kdf(password, salt, ITER);
    const rkek = await kdf(normRK(rk), rsalt, ITER);
    const body = { iterations: ITER, salt, recovery_salt: rsalt,
      wrapped_key: B64.enc(await seal(kek, dekRaw, "qq:dek")), recovery_wrapped_key: B64.enc(await seal(rkek, dekRaw, "qq:dek")),
      transfer_hash: await transferHash(rk) };
    await api("/vault/keys", { method: "POST", body });
    V.dek = await importDek(dekRaw);
    dekRaw.fill(0);
    await loadKeys();
    return rk;
  }
  async function rawDekByPassword(password) {
    const kek = await kdf(password, V.keys.salt, V.keys.iterations);
    return await unseal(kek, B64.dec(V.keys.wrapped_key), "qq:dek");
  }
  async function rawDekByRecovery(rk) {

  }
  async function rewrap(dekRaw, { password, rk }) {
    const body = { replace: true, iterations: ITER,
      salt: V.keys.salt, wrapped_key: V.keys.wrapped_key, recovery_salt: V.keys.recovery_salt, recovery_wrapped_key: V.keys.recovery_wrapped_key };
    if (password) { body.salt = B64.enc(rand(16)); body.wrapped_key = B64.enc(await seal(await kdf(password, body.salt, ITER), dekRaw, "qq:dek")); }
    if (rk) {
      body.recovery_salt = B64.enc(rand(16));
      body.recovery_wrapped_key = B64.enc(await seal(await kdf(normRK(rk), body.recovery_salt, ITER), dekRaw, "qq:dek"));
      body.transfer_hash = await transferHash(rk);
    }
    if (!password) body.iterations = V.keys.iterations;
    if (password && !rk && V.keys.iterations !== ITER) { /* tiklash qismi eski iteratsiya bilan qoladi */ body.iterations = ITER; }
    await api("/vault/keys", { method: "POST", body });

        el("div", { class: "lbl" }, "Bot yuborgan xabar va fayllarni forward qiliş, saqlaş va telefonda skrinşot oliş taqiqlanadi")), prot),
      el("div", { class: "note", style: "margin-bottom:6px" }, `Avto-qulf: 5 daqiqa harakatsizlikdan keyin.`),
      change, newRk, V.dek ? el("button", { class: "btn sec", onclick: () => lock() }, "🔒 Hozir qulflaş") : null,
      el("div", { style: "height:18px" })];
  }

  // ============================================================ FAYLLAR
  const F = { list: null, metas: new Map(), uploading: [] };
  async function loadFiles() {
    const r = await api("/files");
    F.list = r.files;
    if (V.dek) for (const f of F.list) if (f.encrypted && !F.metas.has(f.id)) {
      try { F.metas.set(f.id, JSON.parse(td.decode(await unseal(V.dek, B64.dec(f.enc_meta), "qq:meta")))); } catch (_) {}
    }
    renderFiles();
  }
  const FKIND = { photo: "🖼", video: "🎬", animation: "🎞", audio: "🎵", voice: "🎙", video_note: "⭕️", document: "📄", file: "🔒" };
  function fileName(f) {
    if (f.encrypted) { const m = F.metas.get(f.id); return m ? m.name : "🔒 Şifrlangan fayl"; }
    return f.file_name || ({ photo: "Rasm", video: "Video", animation: "GIF", audio: "Audio", voice: "Ovozli xabar", video_note: "Video xabar" }[f.kind] || "Fayl") + " #" + f.id;
  }
  function fileSub(f) {
    const st = { tg_only: "Telegram bulutida", pending: "nusxasi yozilmoqda…", stored: "Telegram + zaxira nusxa", failed: "nusxa olinmadi", ready: "şifrlangan" }[f.status] || f.status;
    return [f.size ? fmtBytes(f.size) : null, fmtDate(f.created_at), st].filter(Boolean).join(" · ");
  }
  function renderFiles() {
    const box = $("tabFiles");
    if (cur === "files") $("fab").hidden = false;
    if (!F.list) { box.replaceChildren(el("div", { class: "skel" }), el("div", { class: "skel" })); return; }
    const up = F.uploading.map((u) => el("div", { class: "item" }, el("div", { class: "ic" }, "⬆️"),
      el("div", { class: "grow" }, el("div", { class: "t" }, u.name), el("div", { class: "s" }, u.err ? "Xato: " + u.err : `Şifrlanib yuklanmoqda… ${Math.round(u.p * 100)}%`),
        el("div", { class: "progress" }, el("b", { style: `width:${Math.round(u.p * 100)}%` })))));
    const head = el("div", { class: "info", style: "margin-top:4px" },
      "📤 Istalgan hajmdagi faylni bot çatiga yuboring — u şu yerda paydo böladi. 🔒 Maxfiy hujjatlarni pastdagi + tugmasi bilan yuklang: ular master parol bilan şifrlanadi.",
      V.dek ? null : el("div", { style: "margin-top:6px" }, "Şifrlangan fayllar nomini körish uçun Seyf'ni oçing."));
    if (!F.list.length && !up.length) {
      return box.replaceChildren(head, el("div", { class: "empty" }, el("div", { style: "font-size:40px" }, "📁"), el("h2", null, "Hali fayl yöq"),
        el("div", null, "Rasm, video, hujjat — istalgan faylni botga yuboring.")));
    }
    box.replaceChildren(head, el("div", { class: "list" }, up, F.list.map((f) =>
      el("button", { class: "item", onclick: () => fileActions(f) },
        el("div", { class: "ic" }, f.encrypted ? "🔒" : (FKIND[f.kind] || "📄")),
        el("div", { class: "grow" }, el("div", { class: "t" }, fileName(f)), el("div", { class: "s" }, fileSub(f)))))));
  }

  function fileActions(f) {
    const acts = [];
    if (!f.encrypted) {
      const send = el("button", { class: "btn" }, "📤 Telegramga yuboriş");
      send.onclick = async () => { const done = busy(send, "Yuborilmoqda…"); try { await api("/files/send", { method: "POST", body: { id: f.id } }); toast("Bot çatiga yuborildi"); closeSheet(); } catch (_) { toast("Yuborib bölmadi"); } done(); };
      acts.push(send);
      if (f.status === "stored") acts.push(el("button", { class: "btn sec", onclick: async () => {
        try { const r = await api(`/files/download?id=${f.id}&download=1`); if (tg && tg.downloadFile && tg.isVersionAtLeast && tg.isVersionAtLeast("8.0")) tg.downloadFile({ url: r.url, file_name: fileName(f) }); else openLink(r.url); }
        catch (_) { toast("Yuklab bölmadi"); } } }, "⬇️ Zaxira nusxani yuklaş"));
    } else {
      if (!V.dek) acts.push(el("button", { class: "btn", onclick: () => { closeSheet(); switchTab("vault"); toast("Avval Seyf'ni oçing"); } }, "🔐 Seyf'ni oçiş"));
      else {
        const open = el("button", { class: "btn" }, "👁 Oçiş");
        open.onclick = async () => {
          const done = busy(open, "Şifr oçilmoqda…");
          try { const blob = await decryptFile(f, (p) => { open.textContent = `Şifr oçilmoqda… ${Math.round(p * 100)}%`; }); done(); previewBlob(f, blob); }
          catch (_) { done(); toast("Oçib bölmadi"); }
        };
        acts.push(open);
      }
    }
    const del = el("button", { class: "btn danger" }, "🗑 Öçiriş");
    del.onclick = async () => {
      if (del.dataset.sure !== "1") { del.dataset.sure = "1"; del.textContent = "Rostdan öçirilsinmi? Yana bir bosing"; return; }
      try { await api("/files/delete", { method: "POST", body: { id: f.id } }); closeSheet(); await loadFiles(); toast("Öçirildi"); } catch (_) { toast("Öçirib bölmadi"); }
    };
    acts.push(del);
    openSheet(el("h3", null, fileName(f)), el("div", { class: "note", style: "margin:-6px 0 12px" }, fileSub(f)),
      f.caption ? el("div", { class: "info", style: "margin-bottom:8px" }, f.caption) : null, ...acts);
  }

  async function decryptFile(f, onp) {
    const meta = F.metas.get(f.id) || {};
    const parts = [];
    for (let i = 0; i < f.chunks; i++) {
      const r = await api(`/files/chunk_url?id=${f.id}&i=${i}&mode=get`);
      const res = await fetch(r.url);
      if (!res.ok) throw new Error("download");
      parts.push(await unseal(V.dek, new Uint8Array(await res.arrayBuffer()), `qq:file:${f.id}:${i}:${f.chunks}`));
      onp && onp((i + 1) / f.chunks);
    }
    return new Blob(parts, { type: meta.mime || "application/octet-stream" });
  }
  function previewBlob(f, blob) {
    const meta = F.metas.get(f.id) || {};
    const url = URL.createObjectURL(blob);
    let view = null;
    if (/^image\//.test(blob.type)) view = el("img", { src: url });
    else if (/^video\//.test(blob.type)) view = el("video", { src: url, controls: true, playsinline: true });
    else if (/^audio\//.test(blob.type)) view = el("audio", { src: url, controls: true, style: "width:100%" });
    else if (/^text\/|json/.test(blob.type) && blob.size < 2e6) { view = el("pre"); blob.text().then((t) => { view.textContent = t; }); }
    const save = el("a", { class: "btn sec", href: url, download: meta.name || "fayl" }, "⬇️ Qurilmaga saqlaş");
    openSheet(el("h3", null, meta.name || "Fayl"), el("div", { class: "preview" }, view || el("div", { class: "info" }, "Bu fayl turini şu yerda körsatib bölmaydi. Qurilmaga saqlang.")), save);
  }

  $("filePick").onchange = async (e) => {
    const files = [...e.target.files];
    e.target.value = "";
    if (!V.dek) { switchTab("vault"); return toast("Şifrlab yuklaş uçun avval Seyf'ni oçing"); }
    for (const file of files) await uploadEncrypted(file);
  };
  async function uploadEncrypted(file) {
    const u = { name: file.name, p: 0 };
    F.uploading.push(u); renderFiles();
    try {
      const chunks = Math.max(1, Math.ceil(file.size / CHUNK));
      if (file.size === 0) throw new Error("böş fayl");
      const meta = { name: file.name, mime: file.type || "application/octet-stream", size: file.size };
      const encMeta = B64.enc(await seal(V.dek, te.encode(JSON.stringify(meta)), "qq:meta"));
      let init;
      try { init = await api("/files/upload_init", { method: "POST", body: { size: file.size, chunks, chunk_size: CHUNK, enc_meta: encMeta } }); }
      catch (err) { throw new Error(err.message === "quota" ? "joy yetmaydi" : err.message); }
      const id = init.id;
      F.metas.set(id, meta);
      let next = 0, done = 0;
      const worker = async () => {
        while (next < chunks) {
          const i = next++;
          const plain = new Uint8Array(await file.slice(i * CHUNK, Math.min(file.size, (i + 1) * CHUNK)).arrayBuffer());
          const box = await seal(V.dek, plain, `qq:file:${id}:${i}:${chunks}`);
          const r = await api(`/files/chunk_url?id=${id}&i=${i}`);
          const put = await fetch(r.url, { method: "PUT", headers: { "Content-Type": "application/octet-stream", "x-upsert": "true" }, body: box });
          if (!put.ok) throw new Error("yuklaş " + put.status);
          done++; u.p = done / chunks; renderFiles();
        }
      };
      await Promise.all([worker(), worker()]);
      await api("/files/upload_done", { method: "POST", body: { id } });
      F.uploading = F.uploading.filter((x) => x !== u);
      toast("🔒 Şifrlab saqlandi");
      await loadFiles();
      loadMe().catch(() => {});
    } catch (err) {
      u.err = err.message || "xato"; renderFiles();
      setTimeout(() => { F.uploading = F.uploading.filter((x) => x !== u); renderFiles(); }, 6000);
    }
  }

  // ============================================================ TABLAR
  let cur = "vault";
  let channelsLoaded = false;
  function switchTab(t) {
    cur = t;
    for (const b of $("nav").querySelectorAll("button")) b.classList.toggle("on", b.dataset.tab === t);
    $("tabVault").hidden = t !== "vault";
    $("tabFiles").hidden = t !== "files";
    $("tabChannels").hidden = t !== "channels";
    $("chTools").hidden = t !== "channels";
    $("fab").hidden = !((t === "vault" && V.dek) || t === "files");
    $("fab").textContent = t === "files" ? "⬆" : "+";
    try { localStorage.setItem("qq_tab", t); } catch (_) {}
    if (t === "vault") renderVault();
    if (t === "files") { renderFiles(); loadFiles().catch(() => toast("Fayllarni yuklab bölmadi")); }
    if (t === "channels" && !channelsLoaded) { channelsLoaded = true; loadPosts(true); }
    window.scrollTo(0, 0);
  }
  for (const b of $("nav").querySelectorAll("button")) b.onclick = () => switchTab(b.dataset.tab);

  // ------------------------------------------------------------ boshlash
  async function loadMe() {
    state.me = await api("/me");
    renderHeader();
  }

  async function boot() {
    if (!initData) {
      $("tabVault").replaceChildren(el("div", { class: "empty" }, el("div", { style: "font-size:40px" }, "🔒"), el("h2", null, "Telegram ichida oçing"),
        el("div", null, "Qora Quti faqat Telegram'dagi @qora_quti_bot orqali oçiladi.")));
      $("nav").hidden = true;
      return;
    }
    $("tabVault").replaceChildren(el("div", { class: "skel" }), el("div", { class: "skel" }));
    try {
      await Promise.all([loadMe(), loadKeys()]);
      if (!V.keys.exists) { try { V.transfer = await api("/recovery/status"); } catch (_) {} }
    } catch (e) {
      $("tabVault").replaceChildren(el("div", { class: "empty" }, el("h2", null, e.status === 401 ? "Kiriş tasdiqlanmadi" : "Ulanib bölmadi"),
        el("div", null, e.status === 401 ? "Mini App'ni bot menyusidan qayta oçing." : "Birozdan keyin qayta urinib köring."),
        el("br"), el("button", { class: "cta", onclick: boot }, "Qayta urinish")));
      return;
    }
    if (state.me.channels.length === 1) state.channel = state.me.channels[0].id;
    renderHeader();
    let t = "vault";
    try { t = localStorage.getItem("qq_tab") || "vault"; } catch (_) {}
    switchTab(["vault", "files", "channels"].includes(t) ? t : "vault");
  }
  boot();
})();
</script>
</body>
</html>
