<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Qora Quti</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #0f1012);
    --bg2: var(--tg-theme-secondary-bg-color, #17181b);
    --card: var(--tg-theme-section-bg-color, #1c1d21);
    --text: var(--tg-theme-text-color, #ececee);
    --hint: var(--tg-theme-hint-color, #8b8d94);
    --link: var(--tg-theme-link-color, #ff8a2a);
    --accent: #ff7a1a;
    --accent-soft: rgba(255, 122, 26, .14);
    --line: rgba(127, 127, 127, .18);
    --ok: #35c46a; --warn: #f0a020; --bad: #e5484d;
    --r: 14px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body { font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; padding-bottom: env(safe-area-inset-bottom); }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 0 12px 32px; }

  header { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 12px 0 8px; }
  .top { display: flex; align-items: center; gap: 10px; }
  .logo { width: 30px; height: 30px; border-radius: 8px; background: #111; border: 2px solid var(--accent); display: grid; place-items: center; flex: none; }
  .logo i { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 10px var(--accent); }
  .brand { font-weight: 700; font-size: 17px; letter-spacing: .2px; }
  .usage { margin-left: auto; text-align: right; font-size: 12px; color: var(--hint); }
  .bar { width: 96px; height: 4px; border-radius: 4px; background: var(--line); margin-top: 3px; overflow: hidden; }
  .bar b { display: block; height: 100%; background: var(--accent); width: 0; }
  .icon-btn { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: var(--bg2); flex: none; }

  .search { margin-top: 10px; position: relative; }
  .search input { width: 100%; padding: 10px 12px 10px 36px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg2); color: var(--text); font: inherit; outline: none; }
  .search input:focus { border-color: var(--accent); }
  .search svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); opacity: .55; }
  .chips { display: flex; gap: 6px; overflow-x: auto; margin-top: 10px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; padding: 6px 12px; border-radius: 999px; background: var(--bg2); font-size: 13px; white-space: nowrap; display: flex; align-items: center; gap: 6px; }
  .chip.on { background: var(--accent); color: #111; font-weight: 600; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--hint); }
  .dot.active { background: var(--ok); } .dot.paused, .dot.over_quota { background: var(--warn); } .dot.bot_removed { background: var(--bad); }

  .feed { display: flex; flex-direction: column; gap: 10px; margin-top: 6px; }
  .post { background: var(--card); border-radius: var(--r); padding: 12px 12px 10px; border: 1px solid var(--line); }
  .meta { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--hint); margin-bottom: 6px; flex-wrap: wrap; }
  .meta .ch { color: var(--text); font-weight: 600; font-size: 13px; }
  .badge { font-size: 11px; padding: 2px 7px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }
  .badge.btn { cursor: pointer; }
  .fwd { font-size: 12px; color: var(--hint); margin-bottom: 4px; }
  .text { white-space: pre-wrap; word-wrap: break-word; overflow-wrap: anywhere; }
  .text a { color: var(--link); text-decoration: none; }
  .text code { font-family: ui-monospace, Menlo, monospace; font-size: 13px; background: var(--bg2); padding: 1px 4px; border-radius: 4px; }
  .text pre { font-family: ui-monospace, Menlo, monospace; font-size: 13px; background: var(--bg2); padding: 8px; border-radius: 8px; overflow-x: auto; margin: 4px 0; white-space: pre; }
  .text .spoiler { background: var(--hint); color: transparent; border-radius: 3px; cursor: pointer; }
  .text .spoiler.open { background: none; color: inherit; }
  .text blockquote { margin: 4px 0; padding-left: 10px; border-left: 3px solid var(--accent); }

  .media { display: grid; gap: 4px; margin: 8px 0 4px; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
  .media.one { grid-template-columns: 1fr; }
  .m { position: relative; border-radius: 10px; overflow: hidden; background: var(--bg2); min-height: 120px; display: grid; place-items: center; text-align: center; font-size: 13px; color: var(--hint); }
  .m img, .m video { width: 100%; height: 100%; max-height: 420px; object-fit: cover; display: block; }
  .media.one .m img, .media.one .m video { object-fit: contain; background: #000; }
  .m .act { padding: 14px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .m .act b { color: var(--text); font-weight: 600; }
  .m.file { min-height: 0; grid-template-columns: auto 1fr auto; display: grid; text-align: left; padding: 10px 12px; gap: 10px; place-items: center start; }
  .m.file .ico { width: 36px; height: 36px; border-radius: 9px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-size: 16px; }
  .m.file .nm { color: var(--text); font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
  .m.file .sz { font-size: 12px; }
  .m audio { width: 100%; }
  .pill { font-size: 12px; padding: 5px 10px; border-radius: 999px; background: var(--accent); color: #111; font-weight: 600; }
  .note { font-size: 12px; color: var(--hint); }

  .foot { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; font-size: 12px; color: var(--hint); }
  .foot button { color: var(--link); font-size: 13px; }

  .more { display: block; margin: 14px auto 0; padding: 10px 18px; border-radius: 12px; background: var(--bg2); font-size: 14px; }
  .empty { text-align: center; padding: 40px 16px; color: var(--hint); }
  .empty h2 { color: var(--text); font-size: 18px; margin: 12px 0 6px; }
  .empty ol { text-align: left; display: inline-block; margin: 10px 0 16px; padding-left: 18px; }
  .cta { display: inline-block; padding: 12px 20px; border-radius: 12px; background: var(--accent); color: #111; font-weight: 700; }
  .skel { height: 92px; border-radius: var(--r); background: linear-gradient(90deg, var(--bg2), var(--card), var(--bg2)); background-size: 200% 100%; animation: sk 1.2s infinite; }
  @keyframes sk { to { background-position: -200% 0; } }

  .sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 20; display: none; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; background: var(--bg); border-radius: 18px 18px 0 0; max-height: 82vh; overflow-y: auto; padding: 8px 16px calc(20px + env(safe-area-inset-bottom)); transform: translateY(100%); transition: transform .22s ease; }
  .sheet { visibility: hidden; } .sheet.open { transform: none; visibility: visible; } .sheet-bg.open { display: block; }
  .grab { width: 40px; height: 4px; border-radius: 4px; background: var(--line); margin: 4px auto 12px; }
  .sheet h3 { margin: 0 0 12px; font-size: 17px; }
  .ver { border-left: 3px solid var(--line); padding: 2px 0 2px 10px; margin-bottom: 14px; }
  .ver.cur { border-color: var(--accent); }
  .ver .when { font-size: 12px; color: var(--hint); margin-bottom: 4px; }
  .row { display: flex; align-items: center; gap: 10px; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .row .grow { flex: 1; min-width: 0; }
  .row .t { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .s { font-size: 12px; color: var(--hint); }
  .sbtn { font-size: 13px; padding: 7px 12px; border-radius: 10px; background: var(--bg2); }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #222; color: #fff; padding: 9px 14px; border-radius: 10px; font-size: 13px; z-index: 30; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: 90vw; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="top">
      <div class="logo"><i></i></div>
      <div class="brand">Qora Quti</div>
      <div class="usage" id="usage"></div>
      <button class="icon-btn" id="btnSettings" aria-label="Sozlamalar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
    </div>
    <div class="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Arxivdan qidiriş…" autocomplete="off" enterkeyhint="search">
    </div>
    <div class="chips" id="chips"></div>
  </header>
  <main class="feed" id="feed"></main>
  <button class="more" id="more" hidden>Yana yuklaş</button>
</div>

<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet"><div class="grab"></div><div id="sheetBody"></div></div>
<div class="toast" id="toast"></div>

<script>
(() => {
  const API = "https://zupzvekirthvknydjjga.supabase.co/functions/v1/qq-bot/api";
  const tg = window.Telegram && window.Telegram.WebApp;
  const initData = tg ? tg.initData : "";
  const $ = (id) => document.getElementById(id);
  const MONTHS = ["yanvar", "fevral", "mart", "aprel", "may", "iyun", "iyul", "avgust", "sentyabr", "oktyabr", "noyabr", "dekabr"];
  const STATUS = { active: "yozilmoqda", paused: "töxtatilgan", over_quota: "limitdan taşqari", bot_removed: "bot olib taşlangan" };

  const state = { me: null, channel: null, q: "", next: null, loading: false, posts: [] };

  if (tg) {
    tg.ready();
    tg.expand();
    try { tg.setHeaderColor("bg_color"); } catch (_) {}
  }

  // ------------------------------------------------------------ yordamchilar
  function el(tag, attrs, ...kids) {
    const n = document.createElement(tag);
    if (attrs) for (const [k, v] of Object.entries(attrs)) {
      if (v == null || v === false) continue;
      if (k === "class") n.className = v;
      else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, v === true ? "" : v);
    }
    for (const c of kids.flat()) if (c != null && c !== false) n.append(c.nodeType ? c : String(c));
    return n;
  }
  function toast(msg) {
    const t = $("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toast._t);
    toast._t = setTimeout(() => t.classList.remove("show"), 2200);
  }
  function fmtBytes(n) {
    if (!n || n < 1024) return (n || 0) + " B";
    const u = ["KB", "MB", "GB", "TB"]; let v = n / 1024, i = 0;
    while (v >= 1024 && i < u.length - 1) { v /= 1024; i++; }
    return (v < 10 ? v.toFixed(1) : Math.round(v)) + " " + u[i];
  }
  function fmtDate(iso) {
    const d = new Date(iso);
    const p = new Intl.DateTimeFormat("en-GB", { timeZone: "Asia/Tashkent", year: "numeric", month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit", hourCycle: "h23" })
      .formatToParts(d).reduce((a, x) => (a[x.type] = x.value, a), {});
    const now = new Date();
    const sameYear = String(now.getFullYear()) === p.year;
    return `${Number(p.day)}-${MONTHS[Number(p.month) - 1]}${sameYear ? "" : " " + p.year}, ${p.hour}:${p.minute}`;
  }
  function fmtDur(s) {
    if (!s) return "";
    const m = Math.floor(s / 60), r = s % 60;
    return `${m}:${String(r).padStart(2, "0")}`;
  }
  function openLink(url) {
    if (tg && /^https:\/\/t\.me\//.test(url)) tg.openTelegramLink(url);
    else if (tg) tg.openLink(url);
    else window.open(url, "_blank", "noopener");
  }

  async function api(path, opts = {}) {
    const res = await fetch(API + path, {
      method: opts.method || "GET",
      headers: { Authorization: "tma " + initData, ...(opts.body ? { "Content-Type": "application/json" } : {}) },
      body: opts.body ? JSON.stringify(opts.body) : undefined,
    });
    let data = null;
    try { data = await res.json(); } catch (_) {}
    if (!res.ok) { const e = new Error((data && data.error) || "HTTP " + res.status); e.status = res.status; e.data = data; throw e; }
    return data;
  }

  // ------------------------------------------------------------ Telegram formatlash (entities)
  // Ofsetlar UTF-16 birliklarda — JS satrlari ham UTF-16, shuning uchun to'g'ridan-to'g'ri kesamiz.
  function renderText(text, entities) {
    const root = el("div", { class: "text" });
    if (!text) return root;
    const ents = (entities || []).filter((e) => e && e.length > 0 && e.offset >= 0 && e.offset + e.length <= text.length);
    const points = new Set([0, text.length]);
    for (const e of ents) { points.add(e.offset); points.add(e.offset + e.length); }
    const cuts = [...points].sort((a, b) => a - b);
    for (let i = 0; i < cuts.length - 1; i++) {
      const a = cuts[i], b = cuts[i + 1];
      const piece = text.slice(a, b);
      const active = ents.filter((e) => e.offset <= a && e.offset + e.length >= b).sort((x, y) => y.length - x.length);
      let node = document.createTextNode(piece);
      for (const e of active.reverse()) node = wrap(e, node, piece);
      root.append(node);
    }
    return root;
  }
  function safeUrl(u) {
    try { const x = new URL(u); return /^(https?|tg):$/.test(x.protocol) ? x.href : null; } catch (_) { return null; }
  }
  function wrap(e, inner, piece) {
    const t = e.type;
    if (t === "bold") return el("b", null, inner);
    if (t === "italic") return el("i", null, inner);
    if (t === "underline") return el("u", null, inner);
    if (t === "strikethrough") return el("s", null, inner);
    if (t === "code") return el("code", null, inner);
    if (t === "pre") return el("pre", null, inner);
    if (t === "blockquote" || t === "expandable_blockquote") return el("blockquote", null, inner);
    if (t === "spoiler") { const s = el("span", { class: "spoiler" }, inner); s.onclick = () => s.classList.add("open"); return s; }
    if (t === "text_link" || t === "url") {
      const href = safeUrl(t === "url" ? (/^https?:/i.test(piece) ? piece : "https://" + piece) : e.url);
      if (!href) return inner;
      return el("a", { href, onclick: (ev) => { ev.preventDefault(); openLink(href); } }, inner);
    }
    if (t === "mention") {
      const href = "https://t.me/" + piece.replace(/^@/, "");
      return el("a", { href, onclick: (ev) => { ev.preventDefault(); openLink(href); } }, inner);
    }
    return inner;
  }

  // ------------------------------------------------------------ media
  const KIND_ICON = { document: "📄", audio: "🎵", voice: "🎙", video: "🎬", animation: "🎞", video_note: "⭕️", photo: "🖼" };
  const MSTATUS = {
    pending: "Arxivga yuklanmoqda…",
    too_big: "20 MB dan katta — hozirça faqat Telegramda",
    over_quota: "Media limiti tögan",
    failed: "Saqlab bölmadi",
  };

  const urlCache = new Map();
  async function mediaUrl(id, download) {
    const key = id + (download ? ":d" : "");
    const c = urlCache.get(key);
    if (c && c.exp > Date.now()) return c.url;
    const r = await api(`/media?id=${encodeURIComponent(id)}${download ? "&download=1" : ""}`);
    urlCache.set(key, { url: r.url, exp: Date.now() + (r.expires_in - 60) * 1000 });
    return r.url;
  }

  const io = "IntersectionObserver" in window ? new IntersectionObserver((list) => {
    for (const en of list) if (en.isIntersecting) { io.unobserve(en.target); en.target._load && en.target._load(); }
  }, { rootMargin: "300px" }) : null;

  function mediaBox(m, single, link) {
    const visual = ["photo", "video", "animation", "video_note"].includes(m.kind);
    if (m.status !== "stored") {
      const box = el("div", { class: "m" + (visual ? "" : " file") });
      if (visual) box.append(el("div", { class: "act" }, el("span", null, KIND_ICON[m.kind] || "📎"), el("span", { class: "note" }, MSTATUS[m.status] || m.status),
        m.status === "too_big" ? el("button", { class: "pill", onclick: () => openLink(link) }, "Telegramda oçiş") : null));
      else box.append(el("div", { class: "ico" }, KIND_ICON[m.kind] || "📎"),
        el("div", null, el("div", { class: "nm" }, m.file_name || m.kind), el("div", { class: "sz note" }, MSTATUS[m.status] || m.status)), el("span"));
      return box;
    }
    if (m.kind === "photo") {
      const box = el("div", { class: "m" }, el("span", { class: "note" }, "…"));
      if (m.width && m.height && single) box.style.aspectRatio = `${m.width} / ${m.height}`;
      box._load = async () => {
        try {
          const url = await mediaUrl(m.id);
          const img = el("img", { src: url, alt: "", loading: "lazy" });
          img.onclick = () => openLink(url);
          box.replaceChildren(img);
        } catch (_) { box.replaceChildren(el("span", { class: "note" }, "Rasm oçilmadi")); }
      };
      io ? io.observe(box) : box._load();
      return box;
    }
    if (visual) {
      const box = el("div", { class: "m" });
      if (m.width && m.height && single) box.style.aspectRatio = `${m.width} / ${m.height}`;
      const play = el("button", { class: "act" }, el("b", null, "▶ Körish"), el("span", { class: "note" }, [fmtDur(m.duration), fmtBytes(m.size)].filter(Boolean).join(" · ")));
      play.onclick = async () => {
        play.disabled = true;
        try {
          const url = await mediaUrl(m.id);
          const v = el("video", { src: url, controls: true, playsinline: true, autoplay: true, loop: m.kind === "animation" ? true : null, muted: m.kind === "animation" ? true : null });
          box.replaceChildren(v);
        } catch (_) { play.disabled = false; toast("Video oçilmadi"); }
      };
      box.append(play);
      return box;
    }
    if (m.kind === "audio" || m.kind === "voice") {
      const box = el("div", { class: "m file" }, el("div", { class: "ico" }, KIND_ICON[m.kind]),
        el("div", { style: "min-width:0;width:100%" }, el("div", { class: "nm" }, m.file_name || (m.kind === "voice" ? "Ovozli xabar" : "Audio")),
          el("div", { class: "sz note" }, [fmtDur(m.duration), fmtBytes(m.size)].filter(Boolean).join(" · "))),
        el("button", { class: "pill" }, "▶"));
      box.lastChild.onclick = async () => {
        try {
          const url = await mediaUrl(m.id);
          box.replaceChildren(el("audio", { src: url, controls: true, autoplay: true }));
        } catch (_) { toast("Audio oçilmadi"); }
      };
      return box;
    }
    // hujjat
    const box = el("div", { class: "m file" }, el("div", { class: "ico" }, KIND_ICON.document),
      el("div", { style: "min-width:0;width:100%" }, el("div", { class: "nm" }, m.file_name || "Fayl"), el("div", { class: "sz note" }, fmtBytes(m.size))),
      el("button", { class: "pill" }, "Yuklaş"));
    box.lastChild.onclick = async () => {
      try {
        const url = await mediaUrl(m.id, true);
        if (tg && tg.downloadFile && tg.isVersionAtLeast && tg.isVersionAtLeast("8.0")) tg.downloadFile({ url, file_name: m.file_name || "fayl" });
        else openLink(url);
      } catch (_) { toast("Fayl oçilmadi"); }
    };
    return box;
  }

  // ------------------------------------------------------------ postlar
  // Albom (media_group_id) postlarini bitta kartaga birlaştiramiz
  function groupPosts(posts) {
    const out = [];
    for (const p of posts) {
      const last = out[out.length - 1];
      if (last && p.media_group_id && last.media_group_id === p.media_group_id && last.channel_id === p.channel_id) {
        last.media = [...p.media, ...last.media];
        if (!last.text && p.text) { last.text = p.text; last.entities = p.entities; }
        last.edit_count += p.edit_count;
        last.parts.push(p);
      } else out.push({ ...p, media: [...p.media], parts: [p] });
    }
    return out;
  }

  function postCard(p) {
    const media = p.media.filter((m) => m.kind !== "thumb");
    const single = media.length === 1;
    const meta = el("div", { class: "meta" },
      state.channel ? null : el("span", { class: "ch" }, p.channel_title || "Kanal"),
      el("span", null, fmtDate(p.date)),
      p.author ? el("span", null, "· " + p.author) : null,
      p.edit_count > 0 ? el("span", { class: "badge btn", onclick: () => showEdits(p) }, `✎ ${p.edit_count} marta tahrirlangan`) : null);
    return el("article", { class: "post" },
      meta,
      p.forward_from ? el("div", { class: "fwd" }, "↪︎ " + p.forward_from + " dan") : null,
      media.length ? el("div", { class: "media" + (single ? " one" : "") }, media.map((m) => mediaBox(m, single, p.link))) : null,
      p.text ? renderText(p.text, p.entities) : (media.length ? null : el("div", { class: "note" }, "(matnsiz post)")),
      el("div", { class: "foot" }, el("span", null, "#" + p.message_id), el("button", { onclick: () => openLink(p.link) }, "Telegramda oçiş ↗")));
  }

  function renderFeed() {
    const feed = $("feed");
    feed.replaceChildren();
    if (!state.posts.length) {
      feed.append(emptyView());
    } else {
      for (const p of groupPosts(state.posts)) feed.append(postCard(p));
    }
    $("more").hidden = !state.next;
  }

  function emptyView() {
    const me = state.me;
    if (me && !me.channels.length) {
      return el("div", { class: "empty" },
        el("div", { style: "font-size:40px" }, "🗃"),
        el("h2", null, "Hali kanal ulanmagan"),
        el("ol", null,
          el("li", null, "Pastdagi tugmani bosing va kanalingizni tanlang."),
          el("li", null, "Botni admin qiling — maxsus huquq şart emas."),
          el("li", null, "Yangi postlar şu yerda paydo böladi.")),
        el("br"),
        el("button", { class: "cta", onclick: () => openLink(`https://t.me/${me.bot}?startchannel`) }, "➕ Kanal qöşiş"));
    }
    if (state.q) return el("div", { class: "empty" }, el("h2", null, "Hec narsa topilmadi"), el("div", null, "Boşqa söz bilan urinib köring. Kirill va lotin yozuvi farqi yöq."));
    return el("div", { class: "empty" }, el("div", { style: "font-size:40px" }, "⏳"), el("h2", null, "Arxiv hozirça böş"), el("div", null, "Kanalga yangi post çiqsa, u şu yerda saqlanadi."));
  }

  async function loadPosts(reset) {
    if (state.loading) return;
    state.loading = true;
    if (reset) {
      state.posts = []; state.next = null;
      $("feed").replaceChildren(el("div", { class: "skel" }), el("div", { class: "skel" }), el("div", { class: "skel" }));
      $("more").hidden = true;
    } else {
      $("more").textContent = "Yuklanmoqda…";
    }
    const qs = new URLSearchParams();
    if (state.channel) qs.set("channel", state.channel);
    if (state.q) qs.set("q", state.q);
    if (!reset && state.next) qs.set("before", state.next);
    try {
      const r = await api("/posts?" + qs.toString());
      state.posts = reset ? r.posts : state.posts.concat(r.posts);
      state.next = r.next;
      renderFeed();
    } catch (e) {
      if (reset) $("feed").replaceChildren(el("div", { class: "empty" }, el("h2", null, "Yuklab bölmadi"), el("div", null, "Internetni tekşirib, qayta urinib köring."),
        el("br"), el("button", { class: "cta", onclick: () => loadPosts(true) }, "Qayta urinish")));
      else toast("Yuklab bölmadi");
    } finally {
      state.loading = false;
      $("more").textContent = "Yana yuklaş";
    }
  }

  // ------------------------------------------------------------ yuqori qism
  function renderHeader() {
    const me = state.me;
    const pct = Math.min(100, Math.round((me.user.used_bytes / me.limits.bytes) * 100));
    $("usage").replaceChildren(
      el("div", null, `${fmtBytes(me.user.used_bytes)} / ${fmtBytes(me.limits.bytes)}`),
      el("div", { class: "bar" }, el("b", { style: `width:${pct}%` })));
    const chips = $("chips");
    chips.replaceChildren();
    if (me.channels.length > 1) {
      chips.append(el("button", { class: "chip" + (state.channel ? "" : " on"), onclick: () => pickChannel(null) }, "Barçasi"));
    }
    for (const c of me.channels) {
      chips.append(el("button", { class: "chip" + (state.channel === c.id ? " on" : ""), onclick: () => pickChannel(c.id) },
        el("span", { class: "dot " + c.status }), c.title || "Kanal", el("span", { class: "note", style: state.channel === c.id ? "color:inherit" : "" }, String(c.posts_count))));
    }
  }
  function pickChannel(id) {
    if (state.channel === id) return;
    state.channel = id;
    renderHeader();
    loadPosts(true);
  }

  // ------------------------------------------------------------ pastki oyna (sheet)
  function openSheet(...children) {
    $("sheetBody").replaceChildren(...children);
    $("sheetBg").classList.add("open");
    requestAnimationFrame(() => $("sheet").classList.add("open"));
    if (tg && tg.BackButton) { tg.BackButton.show(); tg.BackButton.onClick(closeSheet); }
  }
  function closeSheet() {
    $("sheet").classList.remove("open");
    $("sheetBg").classList.remove("open");
    if (tg && tg.BackButton) { tg.BackButton.offClick(closeSheet); tg.BackButton.hide(); }
  }
  $("sheetBg").onclick = closeSheet;

  async function showEdits(p) {
    openSheet(el("h3", null, "Tahrir tarixi"), el("div", { class: "skel" }));
    try {
      // Albomda tahrir qaysi qismda bo'lsa, o'shani ko'rsatamiz
      const part = p.parts.find((x) => x.edit_count > 0) || p;
      const r = await api(`/edits?post=${encodeURIComponent(part.id)}`);
      const items = [el("div", { class: "ver cur" }, el("div", { class: "when" }, "Hozirgi matn" + (r.current.edited_at ? " · " + fmtDate(r.current.edited_at) : "")), renderText(r.current.text, part.entities))];
      for (const e of [...r.edits].reverse()) {
        items.push(el("div", { class: "ver" }, el("div", { class: "when" }, "Avvalgi variant · " + fmtDate(e.edited_at) + " gaça"), renderText(e.old_text || "(böş)", null)));
      }
      openSheet(el("h3", null, "Tahrir tarixi"), el("div", { class: "note", style: "margin:-6px 0 14px" }, "Post kanalda özgartirilgan. Eski variantlar Qora Qutida saqlangan."), ...items);
    } catch (_) {
      openSheet(el("h3", null, "Tahrir tarixi"), el("div", { class: "note" }, "Yuklab bölmadi."));
    }
  }

  function showSettings() {
    const me = state.me;
    const rows = me.channels.map((c) => {
      const btn = c.status === "active" ? el("button", { class: "sbtn" }, "Töxtatiş")
        : (c.status === "paused" || c.status === "over_quota") ? el("button", { class: "sbtn" }, "Davom ettiriş") : null;
      if (btn) btn.onclick = async () => {
        btn.disabled = true;
        try {
          await api("/channel", { method: "POST", body: { id: c.id, action: c.status === "active" ? "pause" : "resume" } });
          await loadMe();
          showSettings();
        } catch (e) {
          btn.disabled = false;
          toast(e.message === "limit" ? `Tarifingizda ${e.data.limit} ta kanal. Avval boşqasini töxtating.` : "Bajarib bölmadi");
        }
      };
      return el("div", { class: "row" }, el("span", { class: "dot " + c.status }),
        el("div", { class: "grow" }, el("div", { class: "t" }, c.title || "Kanal"), el("div", { class: "s" }, `${STATUS[c.status] || c.status} · ${c.posts_count} ta post`)), btn);
    });
    openSheet(
      el("h3", null, "Kanallar va tarif"),
      ...rows,
      el("div", { class: "row" }, el("div", { class: "grow" },
        el("div", { class: "t" }, me.user.plan === "pro" ? "Pro tarif" : "Bepul tarif"),
        el("div", { class: "s" }, `${me.limits.channels} ta kanal · ${fmtBytes(me.limits.bytes)} media · işlatilgan ${fmtBytes(me.user.used_bytes)}`))),
      el("div", { style: "margin-top:16px;text-align:center" }, el("button", { class: "cta", onclick: () => openLink(`https://t.me/${me.bot}?startchannel`) }, "➕ Kanal qöşiş")),
      el("div", { class: "note", style: "margin-top:14px;text-align:center" }, "Arxiv faqat sizga körinadi. Media fayllar 10 daqiqalik himoyalangan havola orqali oçiladi."));
  }
  $("btnSettings").onclick = () => state.me && showSettings();

  // ------------------------------------------------------------ qidiruv
  let qTimer = null;
  $("q").addEventListener("input", (e) => {
    clearTimeout(qTimer);
    qTimer = setTimeout(() => {
      const v = e.target.value.trim();
      if (v === state.q) return;
      if (v && v.replace(/\s/g, "").length < 2) return;
      state.q = v;
      loadPosts(true);
    }, 350);
  });
  $("q").addEventListener("keydown", (e) => { if (e.key === "Enter") e.target.blur(); });
  $("more").onclick = () => loadPosts(false);

  // ------------------------------------------------------------ boshlash
  async function loadMe() {
    state.me = await api("/me");
    renderHeader();
  }

  async function boot() {
    if (!initData) {
      $("feed").replaceChildren(el("div", { class: "empty" }, el("div", { style: "font-size:40px" }, "🔒"), el("h2", null, "Telegram ichida oçing"),
        el("div", null, "Qora Quti arxivi faqat Telegram'dagi bot orqali oçiladi.")));
      $("q").disabled = true;
      return;
    }
    $("feed").replaceChildren(el("div", { class: "skel" }), el("div", { class: "skel" }));
    try {
      await loadMe();
    } catch (e) {
      $("feed").replaceChildren(el("div", { class: "empty" }, el("h2", null, e.status === 401 ? "Kiriş tasdiqlanmadi" : "Ulanib bölmadi"),
        el("div", null, e.status === 401 ? "Mini App'ni bot menyusidan qayta oçing." : "Birozdan keyin qayta urinib köring."),
        el("br"), el("button", { class: "cta", onclick: boot }, "Qayta urinish")));
      return;
    }
    if (state.me.channels.length === 1) state.channel = state.me.channels[0].id;
    renderHeader();
    await loadPosts(true);
  }
  boot();
})();
</script>
</body>
</html>
