<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Qora Quti</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #0f1012);
    --bg2: var(--tg-theme-secondary-bg-color, #17181b);
    --card: var(--tg-theme-section-bg-color, #1c1d21);
    --text: var(--tg-theme-text-color, #ececee);
    --hint: var(--tg-theme-hint-color, #8b8d94);
    --link: var(--tg-theme-link-color, #ff8a2a);
    --accent: #ff7a1a;
    --accent-soft: rgba(255, 122, 26, .14);
    --line: rgba(127, 127, 127, .18);
    --ok: #35c46a; --warn: #f0a020; --bad: #e5484d;
    --r: 14px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body { font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; padding-bottom: env(safe-area-inset-bottom); }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 0 12px calc(96px + env(safe-area-inset-bottom)); }

  header { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 12px 0 8px; }
  .top { display: flex; align-items: center; gap: 10px; }
  .logo { width: 30px; height: 30px; border-radius: 8px; background: #111; border: 2px solid var(--accent); display: grid; place-items: center; flex: none; }
  .logo i { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 10px var(--accent); }
  .brand { font-weight: 700; font-size: 17px; letter-spacing: .2px; }
  .usage { margin-left: auto; text-align: right; font-size: 12px; color: var(--hint); }
  .bar { width: 96px; height: 4px; border-radius: 4px; background: var(--line); margin-top: 3px; overflow: hidden; }
  .bar b { display: block; height: 100%; background: var(--accent); width: 0; }
  .icon-btn { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: var(--bg2); flex: none; }

  .search { margin-top: 10px; position: relative; }
  .search input { width: 100%; padding: 10px 12px 10px 36px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg2); color: var(--text); font: inherit; outline: none; }
  .search input:focus { border-color: var(--accent); }
  .search svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); opacity: .55; }
  .chips { display: flex; gap: 6px; overflow-x: auto; margin-top: 10px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; padding: 6px 12px; border-radius: 999px; background: var(--bg2); font-size: 13px; white-space: nowrap; display: flex; align-items: center; gap: 6px; }
  .chip.on { background: var(--accent); color: #111; font-weight: 600; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--hint); }
  .dot.active { background: var(--ok); } .dot.paused, .dot.over_quota { background: var(--warn); } .dot.bot_removed { background: var(--bad); }

  .feed { display: flex; flex-direction: column; gap: 10px; margin-top: 6px; }
  .post { background: var(--card); border-radius: var(--r); padding: 12px 12px 10px; border: 1px solid var(--line); }
  .meta { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--hint); margin-bottom: 6px; flex-wrap: wrap; }
  .meta .ch { color: var(--text); font-weight: 600; font-size: 13px; }
  .badge { font-size: 11px; padding: 2px 7px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }
  .badge.btn { cursor: pointer; }
  .fwd { font-size: 12px; color: var(--hint); margin-bottom: 4px; }
  .text { white-space: pre-wrap; word-wrap: break-word; overflow-wrap: anywhere; }
  .text a { color: var(--link); text-decoration: none; }
  .text code { font-family: ui-monospace, Menlo, monospace; font-size: 13px; background: var(--bg2); padding: 1px 4px; border-radius: 4px; }
  .text pre { font-family: ui-monospace, Menlo, monospace; font-size: 13px; background: var(--bg2); padding: 8px; border-radius: 8px; overflow-x: auto; margin: 4px 0; white-space: pre; }
  .text .spoiler { background: var(--hint); color: transparent; border-radius: 3px; cursor: pointer; }
  .text .spoiler.open { background: none; color: inherit; }
  .text blockquote { margin: 4px 0; padding-left: 10px; border-left: 3px solid var(--accent); }

  .media { display: grid; gap: 4px; margin: 8px 0 4px; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
  .media.one { grid-template-columns: 1fr; }
  .m { position: relative; border-radius: 10px; overflow: hidden; background: var(--bg2); min-height: 120px; display: grid; place-items: center; text-align: center; font-size: 13px; color: var(--hint); }
  .m img, .m video { width: 100%; height: 100%; max-height: 420px; object-fit: cover; display: block; }
  .media.one .m img, .media.one .m video { object-fit: contain; background: #000; }
  .m .act { padding: 14px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .m .act b { color: var(--text); font-weight: 600; }
  .m.file { min-height: 0; grid-template-columns: auto 1fr auto; display: grid; text-align: left; padding: 10px 12px; gap: 10px; place-items: center start; }
  .m.file .ico { width: 36px; height: 36px; border-radius: 9px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-size: 16px; }
  .m.file .nm { color: var(--text); font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
  .m.file .sz { font-size: 12px; }
  .m audio { width: 100%; }
  .pill { font-size: 12px; padding: 5px 10px; border-radius: 999px; background: var(--accent); color: #111; font-weight: 600; }
  .note { font-size: 12px; color: var(--hint); }

  .foot { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; font-size: 12px; color: var(--hint); }
  .foot button { color: var(--link); font-size: 13px; }

  .more { display: block; margin: 14px auto 0; padding: 10px 18px; border-radius: 12px; background: var(--bg2); font-size: 14px; }
  .empty { text-align: center; padding: 40px 16px; color: var(--hint); }
  .empty h2 { color: var(--text); font-size: 18px; margin: 12px 0 6px; }
  .empty ol { text-align: left; display: inline-block; margin: 10px 0 16px; padding-left: 18px; }
  .cta { display: inline-block; padding: 12px 20px; border-radius: 12px; background: var(--accent); color: #111; font-weight: 700; }
  .skel { height: 92px; border-radius: var(--r); background: linear-gradient(90deg, var(--bg2), var(--card), var(--bg2)); background-size: 200% 100%; animation: sk 1.2s infinite; }
  @keyframes sk { to { background-position: -200% 0; } }

  .sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 20; display: none; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; background: var(--bg); border-radius: 18px 18px 0 0; max-height: 82vh; overflow-y: auto; padding: 8px 16px calc(20px + env(safe-area-inset-bottom)); transform: translateY(100%); transition: transform .22s ease; }
  .sheet { visibility: hidden; } .sheet.open { transform: none; visibility: visible; } .sheet-bg.open { display: block; }
  .grab { width: 40px; height: 4px; border-radius: 4px; background: var(--line); margin: 4px auto 12px; }
  .sheet h3 { margin: 0 0 12px; font-size: 17px; }
  .ver { border-left: 3px solid var(--line); padding: 2px 0 2px 10px; margin-bottom: 14px; }
  .ver.cur { border-color: var(--accent); }
  .ver .when { font-size: 12px; color: var(--hint); margin-bottom: 4px; }
  .row { display: flex; align-items: center; gap: 10px; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .row .grow { flex: 1; min-width: 0; }
  .row .t { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .s { font-size: 12px; color: var(--hint); }
  .sbtn { font-size: 13px; padding: 7px 12px; border-radius: 10px; background: var(--bg2); }
  .toast { position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: #222; color: #fff; padding: 9px 14px; border-radius: 10px; font-size: 13px; z-index: 30; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: 90vw; }
  .toast.show { opacity: 1; }

  /* ---------------- tablar va seyf */
  [hidden] { display: none !important; }
  .nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: var(--bg2); border-top: 1px solid var(--line); display: flex; padding-bottom: env(safe-area-inset-bottom); }
  .nav button { flex: 1; padding: 8px 0 10px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; color: var(--hint); }
  .nav button .i { font-size: 20px; line-height: 1.1; }
  .nav button.on { color: var(--accent); font-weight: 600; }
  .inp { width: 100%; padding: 11px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg2); color: var(--text); font: inherit; outline: none; }
  textarea.inp { min-height: 84px; resize: vertical; }
  .inp:focus { border-color: var(--accent); }
  .inp.mono, .mono { font-family: ui-monospace, Menlo, monospace; font-size: 14px; }
  .btn { display: block; width: 100%; padding: 13px; border-radius: 12px; background: var(--accent); color: #111; font-weight: 700; text-align: center; margin-top: 10px; }
  .btn.sec { background: var(--bg2); color: var(--text); font-weight: 600; }
  .btn.danger { background: rgba(229, 72, 77, .14); color: var(--bad); font-weight: 600; }
  .btn:disabled { opacity: .55; }
  .lockbox { text-align: center; padding: 28px 6px 10px; }
  .lockbox .big { font-size: 46px; }
  .lockbox h2 { margin: 10px 0 6px; font-size: 20px; }
  .lockbox p { color: var(--hint); margin: 0 0 16px; }
  .rk { font-family: ui-monospace, Menlo, monospace; font-size: 17px; letter-spacing: .5px; background: var(--bg2); padding: 14px; border-radius: 12px; word-break: break-all; text-align: center; user-select: all; -webkit-user-select: all; border: 1px dashed var(--accent); }
  .list { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
  .item { display: flex; align-items: center; gap: 12px; padding: 12px; background: var(--card); border: 1px solid var(--line); border-radius: var(--r); text-align: left; width: 100%; }
  .item .ic { width: 40px; height: 40px; border-radius: 11px; background: var(--accent-soft); display: grid; place-items: center; font-size: 19px; flex: none; }
  .item .grow { flex: 1; min-width: 0; }
  .item .t { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .s { font-size: 12px; color: var(--hint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fab { position: fixed; right: 16px; bottom: calc(76px + env(safe-area-inset-bottom)); width: 56px; height: 56px; border-radius: 50%; background: var(--accent); color: #111; font-size: 30px; line-height: 1; box-shadow: 0 6px 18px rgba(0,0,0,.35); z-index: 9; }
  .fld { margin-bottom: 12px; }
  .fld .lbl { font-size: 12px; color: var(--hint); margin-bottom: 4px; display: flex; justify-content: space-between; align-items: center; }
  .vf { display: flex; align-items: flex-start; gap: 8px; padding: 10px 12px; background: var(--bg2); border-radius: 12px; margin-bottom: 8px; }
  .vf .grow { flex: 1; min-width: 0; }
  .vf .lbl { font-size: 12px; color: var(--hint); }
  .vf .val { word-break: break-all; white-space: pre-wrap; }
  .vf .acts { display: flex; gap: 6px; flex: none; }
  .mini { font-size: 12px; padding: 6px 10px; border-radius: 9px; background: var(--card); white-space: nowrap; }
  .typegrid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .typegrid button { padding: 14px 12px; border-radius: 12px; background: var(--bg2); text-align: left; display: flex; gap: 10px; align-items: center; font-size: 14px; }
  .typegrid button span { font-size: 20px; }
  .progress { height: 6px; border-radius: 6px; background: var(--line); overflow: hidden; margin-top: 8px; }
  .progress b { display: block; height: 100%; background: var(--accent); width: 0; transition: width .2s; }
  .warn { background: rgba(240, 160, 32, .12); border: 1px solid rgba(240, 160, 32, .35); padding: 10px 12px; border-radius: 12px; font-size: 13px; text-align: left; }
  .info { background: var(--bg2); padding: 10px 12px; border-radius: 12px; font-size: 13px; color: var(--hint); }
  .strength { height: 4px; border-radius: 4px; background: var(--line); margin-top: 6px; overflow: hidden; }
  .strength b { display: block; height: 100%; width: 0; transition: width .2s, background .2s; }
  .bar2 { display: flex; gap: 8px; align-items: center; margin-top: 4px; }
  .bar2 .inp { flex: 1; }
  .preview img, .preview video { width: 100%; border-radius: 12px; max-height: 60vh; object-fit: contain; background: #000; }
  .cam { position: relative; border-radius: 16px; overflow: hidden; background: #000; aspect-ratio: 3/4; max-height: 52vh; margin: 0 auto 10px; }
  .cam video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); display: block; }
  .cam .ring { position: absolute; inset: 12% 18%; border: 3px dashed rgba(255,255,255,.55); border-radius: 50%; transition: border-color .2s; }
  .cam .ring.ok { border-color: var(--ok); border-style: solid; }
  .steps { display: flex; gap: 6px; justify-content: center; margin: 6px 0 10px; }
  .steps i { width: 26px; height: 6px; border-radius: 6px; background: var(--line); }
  .steps i.on { background: var(--ok); }
  .preview pre { white-space: pre-wrap; background: var(--bg2); padding: 10px; border-radius: 10px; max-height: 50vh; overflow: auto; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="top">
      <div class="logo"><i></i></div>
      <div class="brand">Qora Quti</div>
      <div class="usage" id="usage"></div>
      <button class="icon-btn" id="btnSettings" aria-label="Sozlamalar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
    </div>
    <div id="chTools" hidden>
    <div class="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Arxivdan qidiriş…" autocomplete="off" enterkeyhint="search">
    </div>
    <div class="chips" id="chips"></div>
    </div>
  </header>
  <section id="tabVault"></section>
  <section id="tabFiles" hidden></section>
  <section id="tabChannels" hidden>
    <main class="feed" id="feed"></main>
    <button class="more" id="more" hidden>Yana yuklaş</button>
  </section>
</div>
<button class="fab" id="fab" hidden aria-label="Qöşiş">+</button>
<input type="file" id="filePick" multiple hidden>
<nav class="nav" id="nav">
  <button data-tab="vault" class="on"><span class="i">🔐</span>Seyf</button>
  <button data-tab="files"><span class="i">📁</span>Fayllar</button>
  <button data-tab="channels"><span class="i">📢</span>Kanallar</button>
</nav>

<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet"><div class="grab"></div><div id="sheetBody"></div></div>
<div class="toast" id="toast"></div>
<div id="shield" hidden style="position:fixed;inset:0;z-index:50;background:var(--bg);display:grid;place-items:center;font-size:48px">🔒</div>

<script>
(() => {

астер-пароль — не менее 10 символов", "The master password must be at least 10 characters"], "Parol juda oddiy: harf, raqam va belgi aralaştiring": ["Слишком простой пароль: смешайте буквы, цифры и символы", "Password too simple: mix letters, digits and symbols"], "Parollar bir xil emas": ["Пароли не совпадают", "Passwords don't match"], "Şifrlanmoqda…": ["Шифрование…", "Encrypting…"], "Bu login band — Sozlamalarda boşqasini tanlang": ["Этот логин занят — выберите другой в настройках", "This login is taken — choose another in Settings"], "Loginni saqlab bölmadi": ["Не удалось сохранить логин", "Couldn't save the login"], "Seyf allaqaçon yaratilgan": ["Сейф уже создан", "The vault already exists"], "Yaratib bölmadi": ["Не удалось создать", "Couldn't create"], "Şaxsiy seyfni yarating": ["Создайте личный сейф", "Create your personal vault"], "Parollar, loginlar, kripto hamyonlar, karta va hujjat ma'lumotlari master parol bilan şu telefonda şifrlanadi. Uni hec kim — hatto Qora Quti ham — oça olmaydi.": ["Пароли, логины, криптокошельки, данные карт и документов шифруются мастер-паролем на этом телефоне. Никто — даже Qora Quti — не сможет их открыть.", "Passwords, logins, crypto wallets, card and document details are encrypted with your master password on this phone. Nobody — not even Qora Quti — can open them."], "Login — boşqa akkauntdan kiriş uçun": ["Логин — для входа с другого аккаунта", "Login — for signing in from another account"], "⚠️ Master parolni unutsangiz, uni faqat tiklaş kaliti bilan qaytarasiz. Ikkalasi ham yöqolsa, ma'lumotni hec kim oça olmaydi.": ["⚠️ Если забудете мастер-пароль, вернуть его можно только ключом восстановления. Если потеряны оба — данные никто не откроет.", "⚠️ If you forget the master password, only the recovery key can restore it. If both are lost, nobody can open the data."], "Avval boşqa Telegram akkauntda seyfingiz bor edimi?": ["Раньше у вас был сейф в другом аккаунте Telegram?", "Did you have a vault in another Telegram account before?"], "♻️ Eski seyfni tiklaş": ["♻️ Восстановить старый сейф", "♻️ Restore an old vault"], "👤 Login va master parol bilan kiriş": ["👤 Войти по логину и мастер-паролю", "👤 Sign in with login and master password"], "🪪 Parolni unutdim — pasport ma'lumotlari bilan": ["🪪 Забыл пароль — по паспортным данным", "🪪 Forgot password — with passport details"], "🙂 Parolni unutdim — yuz bilan": ["🙂 Забыл пароль — по лицу", "🙂 Forgot password — with my face"], "🗝 Tiklaş kaliti bilan": ["🗝 Ключом восстановления", "🗝 With the recovery key"], "📧 Gmail va şaxsiy ma'lumotlar bilan": ["📧 Через Gmail и личные данные", "📧 With Gmail and personal details"], "♻️ Eski seyfimni tiklaş": ["♻️ Восстановить мой старый сейф", "♻️ Restore my old vault"], "Tiklaş tayyor bölsa, seyf şu akkauntga köçirilgan bölişi kerak. Sahifani yangilang.": ["Если восстановление готово, сейф уже должен быть перенесён в этот аккаунт. Обновите страницу.", "If recovery is ready, the vault should already be moved to this account. Reload the page."], "Davom etiş": ["Продолжить", "Continue"], "🗝 Tiklaş kalitingiz": ["🗝 Ваш ключ восстановления", "🗝 Your recovery key"], "Master parolni unutsangiz, seyfni faqat şu kalit bilan oçasiz. Uni qog'ozga yozib, xavfsiz joyda saqlang. Bu kalit boşqa körsatilmaydi.": ["Если забудете мастер-пароль, сейф можно открыть только этим ключом. Запишите его на бумаге и храните в надёжном месте. Больше он показан не будет.", "If you forget the master password, only this key can open the vault. Write it on paper and keep it somewhere safe. It won't be shown again."], "Tiklaş kaliti": ["Ключ восстановления", "Recovery key"], "📋 Nusxa oliş": ["📋 Скопировать", "📋 Copy"], "Kalitni Telegram çatlariga, galereyaga yoki skrinşotga saqlamang.": ["Не сохраняйте ключ в чатах Telegram, галерее или на скриншотах.", "Don't save the key in Telegram chats, your gallery or screenshots."], "Kalitni xavfsiz joyga yozib qöydim": ["Я записал ключ в надёжное место", "I've written the key down somewhere safe"], "Master parol": ["Мастер-пароль", "Master password"], "Oçiş": ["Открыть", "Open"], "Tekşirilmoqda…": ["Проверка…", "Checking…"], "Parol notöğri": ["Неверный пароль", "Wrong password"], "😊 Face ID bilan oçiş": ["😊 Открыть по Face ID", "😊 Open with Face ID"], "🙂 Yuz bilan oçiş": ["🙂 Открыть по лицу", "🙂 Open with my face"], "Kamera…": ["Камера…", "Camera…"], "Barmoq izi": ["Отпечаток пальца", "Fingerprint"], "Seyf qulflangan": ["Сейф заблокирован", "Vault locked"], "Oçiş uçun master parolni kiriting.": ["Введите мастер-пароль, чтобы открыть.", "Enter the master password to open it."], "📧 Tiklaş tayyor — seyfni oçiş": ["📧 Восстановление готово — открыть сейф", "📧 Recovery is ready — open the vault"], "Parolni unutdim": ["Забыл пароль", "Forgot password"], "Qanday tiklaymiz?": ["Как восстановим?", "How shall we recover?"], "🪪 Pasport ma'lumotlari bilan (login va parolni körsatadi)": ["🪪 По паспортным данным (покажет логин и пароль)", "🪪 With passport details (shows login and password)"], "🙂 Yuz bilan (login va parolni körsatadi)": ["🙂 По лицу (покажет логин и пароль)", "🙂 With my face (shows login and password)"], "Gmail usuli faqat oldindan yoqilgan bölsa işlaydi va 7 kun kutişni talab qiladi.": ["Способ через Gmail работает, только если был включён заранее, и требует ожидания 7 дней.", "The Gmail method only works if it was turned on in advance, and it requires a 7-day wait."], "Saqlaş": ["Сохранить", "Save"], "Master parol notöğri": ["Неверный мастер-пароль", "Wrong master password"], "Bu login band, boşqasini tanlang": ["Этот логин занят, выберите другой", "This login is taken, choose another"], "👤 Seyf logini": ["👤 Логин сейфа", "👤 Vault login"], "Telefon yoki Telegram akkaunt yöqolsa, istalgan boşqa akkauntdan şu login va master parol bilan kirasiz — seyf öşa akkauntga köçadi.": ["Если потеряете телефон или аккаунт Telegram, войдёте с любого другого аккаунта по этому логину и мастер-паролю — сейф перейдёт в тот аккаунт.", "If you lose your phone or Telegram account, you can sign in from any other account with this login and master password — the vault moves to that account."], "Master parol (tasdiqlaş uçun)": ["Мастер-пароль (для подтверждения)", "Master password (to confirm)"], "Yoqiş": ["Включить", "Turn on"], "Şifrlanmoqda… (bir necha soniya)": ["Шифрование… (несколько секунд)", "Encrypting… (a few seconds)"], "🪪 Pasport bilan tiklaş yoqildi": ["🪪 Восстановление по паспорту включено", "🪪 Passport recovery is on"], "Bu ma'lumotlar boşqa seyfga bog'langan": ["Эти данные уже привязаны к другому сейфу", "These details are already linked to another vault"], "Avval login tanlang": ["Сначала выберите логин", "Choose a login first"], "🪪 Pasport ma'lumotlari bilan tiklaş": ["🪪 Восстановление по паспортным данным", "🪪 Recovery with passport details"], "Master parolni unutsangiz, şu ma'lumotlarni kiritib login va parolingizni qaytarasiz — istalgan Telegram akkauntdan. Ma'lumotlar şu telefonda kalitga aylanadi: serverga oçiq holda yuborilmaydi va saqlanmaydi. Pasportdagidek yozing.": ["Если забудете мастер-пароль, введите эти данные и получите логин и пароль — с любого аккаунта Telegram. Данные превращаются в ключ на этом телефоне: на сервер они не отправляются в открытом виде и не хранятся. Пишите как в паспорте.", "If you forget the master password, enter these details to get your login and password back — from any Telegram account. The details are turned into a key on this phone: they are not sent to the server in plain form and are not stored. Write them exactly as in your passport."], "⚠️ Pasport ma'lumotlaringizni biladigan odam ham parolni ola olişi mumkin. Har gal körilganda Telegram'ga xabar boradi.": ["⚠️ Человек, знающий ваши паспортные данные, тоже сможет получить пароль. При каждом просмотре вам придёт сообщение в Telegram.", "⚠️ Someone who knows your passport details could also get the password. You'll get a Telegram message every time it is viewed."], "Tekşiriş": ["Проверить", "Check"], "Tekşirilmoqda… (bir necha soniya)": ["Проверка… (несколько секунд)", "Checking… (a few seconds)"], "Ma'lumotlar mos kelmadi. Pasportdagidek yozilganini tekşiring": ["Данные не совпали. Проверьте, что всё написано как в паспорте", "The details didn't match. Check that everything is written as in the passport"], "Juda köp urinish. 24 soatdan keyin qayta urinib köring": ["Слишком много попыток. Попробуйте через 24 часа", "Too many attempts. Try again in 24 hours"], "Tekşirib bölmadi": ["Не удалось проверить", "Couldn't check"], "🪪 Parolni tiklaş": ["🪪 Восстановить пароль", "🪪 Recover password"], "Seyfga ulangan pasport ma'lumotlarini kiriting. Töğri bölsa, login va master parol körsatiladi. Ma'lumotlar serverga oçiq yuborilmaydi.": ["Введите паспортные данные, привязанные к сейфу. Если всё верно, будут показаны логин и мастер-пароль. Данные не отправляются на сервер в открытом виде.", "Enter the passport details linked to the vault. If they're correct, the login and master password will be shown. The details are not sent to the server in plain form."], "➡️ Şu akkauntda seyfni oçiş": ["➡️ Открыть сейф в этом аккаунте", "➡️ Open the vault in this account"], "Oçilmoqda…": ["Открывается…", "Opening…"], "Seyf oçildi": ["Сейф открыт", "Vault opened"], "Oçib bölmadi": ["Не удалось открыть", "Couldn't open"], "🔓 Seyfni oçiş": ["🔓 Открыть сейф", "🔓 Open the vault"], "✅ Topildi": ["✅ Найдено", "✅ Found"], "Parolni eslab qoling yoki xavfsiz joyga yozing. Kerak bölsa, seyfni oçib uni özgartiring.": ["Запомните пароль или запишите его в надёжное место. При необходимости откройте сейф и смените его.", "Remember the password or write it down somewhere safe. If needed, open the vault and change it."], "Kiriş": ["Войти", "Sign in"], "Login va parolni kiriting": ["Введите логин и пароль", "Enter the login and password"], "✅ Seyf şu akkauntga köçirildi va oçildi": ["✅ Сейф перенесён в этот аккаунт и открыт", "✅ The vault was moved to this account and opened"], "Login yoki parol notöğri": ["Неверный логин или пароль", "Wrong login or password"], "Juda köp urinish. Keyinroq qayta urinib köring": ["Слишком много попыток. Попробуйте позже", "Too many attempts. Try again later"], "Bu akkauntda boşqa seyf bor": ["В этом аккаунте уже есть другой сейф", "This account already has another vault"], "Kirib bölmadi": ["Не удалось войти", "Couldn't sign in"], "👤 Login bilan kiriş": ["👤 Вход по логину", "👤 Sign in with login"], "Eski seyfingiz logini va master parolini kiriting. Seyf (yozuvlar, fayllar, kanal arxivi) şu Telegram akkauntga köçadi, eski akkauntga xabar boradi.": ["Введите логин и мастер-пароль старого сейфа. Сейф (записи, файлы, архив каналов) перейдёт в этот аккаунт Telegram, старому аккаунту придёт уведомление.", "Enter the login and master password of your old vault. The vault (items, files, channel archive) moves to this Telegram account, and the old account gets a notification."], "Bu telefonda Face ID / barmoq izi Telegram orqali mavjud emas": ["На этом телефоне Face ID / отпечаток недоступен через Telegram", "Face ID / fingerprint isn't available through Telegram on this phone"], "Avval seyfni oçing": ["Сначала откройте сейф", "Open the vault first"], "Ruxsat berilmadi. Telegram sozlamalaridan yoqing": ["Доступ не дан. Включите его в настройках Telegram", "Permission denied. Turn it on in Telegram settings"], "Yoqib bölmadi": ["Не удалось включить", "Couldn't turn on"], "Master parol (bir marta)": ["Мастер-пароль (один раз)", "Master password (once)"], "Öçirildi": ["Удалено", "Deleted"], "Qora Qutini oçiş": ["Открыть Qora Quti", "Open Qora Quti"], "⬆️ Tepaga qarang": ["⬆️ Посмотрите вверх", "⬆️ Look up"], "⬇️ Pastga qarang": ["⬇️ Посмотрите вниз", "⬇️ Look down"], "⬅️ Çapga qarang": ["⬅️ Посмотрите влево", "⬅️ Look left"], "➡️ Önga qarang": ["➡️ Посмотрите вправо", "➡️ Look right"], "Yuzingizni doira içiga oling va töğriga qarang": ["Поместите лицо в круг и смотрите прямо", "Place your face in the circle and look straight ahead"], "Endi yana töğriga qarang": ["Теперь снова смотрите прямо", "Now look straight ahead again"], "Model yuklanmoqda… (bir marta, ~7 MB)": ["Загрузка модели… (один раз, ~7 МБ)", "Loading the model… (once, ~7 MB)"], "Bekor qiliş": ["Отмена", "Cancel"], "📷 Yuzni skanerlaş": ["📷 Сканировать лицо", "📷 Scan face"], "🙂 Yuz bilan oçişni sozlaş": ["🙂 Настроить вход по лицу", "🙂 Set up face unlock"], "Aytilgan tomonga sekin qarang: tepaga, pastga, çapga, önga": ["Медленно смотрите в указанную сторону: вверх, вниз, влево, вправо", "Slowly look in the direction shown: up, down, left, right"], "🙂 Endi seyfni yuzingiz bilan oçasiz": ["🙂 Теперь сейф открывается по вашему лицу", "🙂 You can now open the vault with your face"], "🙂 Yuz bilan oçiş (selfi)": ["🙂 Вход по лицу (селфи)", "🙂 Face unlock (selfie)"], "Seyfni oçişda kamera yoqiladi: tasodifiy tartibda tepaga, pastga, çapga, önga qaraysiz. Oddiy rasm yoki oldindan yozilgan video bilan oçilmaydi. Kalitning yarmi şu telefonda, yarmi serverda — boşqa telefondan yoki yuzsiz oçilmaydi.": ["При открытии сейфа включится камера: в случайном порядке посмотрите вверх, вниз, влево и вправо. Обычным фото или заранее записанным видео не открыть. Половина ключа хранится на этом телефоне, половина — на сервере: с другого телефона или без лица не открыть.", "When you open the vault the camera turns on: look up, down, left and right in random order. A plain photo or a pre-recorded video won't open it. Half of the key is on this phone and half on the server: it can't be opened from another phone or without your face."], "Yuz mos kelmadi — master parol bilan kiring": ["Лицо не совпало — войдите по мастер-паролю", "Face didn't match — sign in with the master password"], "Juda köp urinish — master parol bilan kiring": ["Слишком много попыток — войдите по мастер-паролю", "Too many attempts — sign in with the master password"], "Yuz bilan oçiş öçirilgan": ["Вход по лицу выключен", "Face unlock is turned off"], "Kameraga ruxsat berilmadi yoki kamera topilmadi": ["Нет доступа к камере или камера не найдена", "No camera access or no camera found"], "Yuz modelini yuklab bölmadi — internetni tekşiring": ["Не удалось загрузить модель лица — проверьте интернет", "Couldn't load the face model — check your internet"], "Harakat vaqtida bajarilmadi — yorug' joyda, aytilgan tomonga sekin qarab qayta urinib köring": ["Движение не выполнено вовремя — встаньте в светлое место и медленно смотрите в указанную сторону", "The movement wasn't done in time — find a bright spot and slowly look in the direction shown"], "🙂 Yuzni saqlaş": ["🙂 Сохранить лицо", "🙂 Save my face"], "Yorug' joyda, telefonni yuz baravarida uşlang": ["В светлом месте держите телефон на уровне лица", "In a bright spot, hold the phone at face level"], "🙂 Yuz bilan tiklaş yoqildi": ["🙂 Восстановление по лицу включено", "🙂 Face recovery is on"], "🙂 Yuz bilan parolni tiklaş": ["🙂 Восстановление пароля по лицу", "🙂 Password recovery with your face"], "Parolni unutsangiz, yangi telefondan login va yuzingiz bilan login-parolni qaytarasiz. Kamera tasodifiy tartibda tepaga, pastga, çapga, önga qaraşni söraydi — oddiy rasm yoki video bilan aldab bölmaydi.": ["Если забудете пароль, с нового телефона вернёте логин и пароль по логину и лицу. Камера в случайном порядке попросит посмотреть вверх, вниз, влево и вправо — обмануть фото или видео не получится.", "If you forget the password, you can get the login and password back from a new phone with your login and face. The camera asks you to look up, down, left and right in random order — a photo or video can't fool it."], "⚠️ Bu usulda yuz andozasi va parolni oçadigan kalit serverda saqlanadi. Boşqa akkauntdan so'ralsa, 24 soat kutiş va Telegram'ga ogohlantiriş boradi — şu vaqtda bekor qila olasiz.": ["⚠️ В этом способе шаблон лица и ключ, открывающий пароль, хранятся на сервере. Если запрос придёт с другого аккаунта — ожидание 24 часа и уведомление в Telegram; за это время можно отменить.", "⚠️ With this method the face template and the key that unlocks the password are stored on the server. If someone asks from another account, there's a 24-hour wait and a Telegram alert; you can cancel during that time."], "📷 Yuz bilan tekşiriş": ["📷 Проверить по лицу", "📷 Check with my face"], "Seyf loginini yozing": ["Введите логин сейфа", "Enter the vault login"], "🙂 Yuzni tekşiriş": ["🙂 Проверка лица", "🙂 Face check"], "⏳ Yuz mos keldi": ["⏳ Лицо совпало", "⏳ Face matched"], "Yuz yoki login mos kelmadi": ["Лицо или логин не совпали", "Face or login didn't match"], "🙂 Yuz bilan tiklaş": ["🙂 Восстановление по лицу", "🙂 Face recovery"], "Seyf loginini yozing va kamerada yuzingizni körsating. Mos kelsa, login va master parol körsatiladi (boşqa akkauntdan — 24 soatdan keyin).": ["Введите логин сейфа и покажите лицо камере. Если совпадёт, будут показаны логин и мастер-пароль (с другого аккаунта — через 24 часа).", "Enter the vault login and show your face to the camera. If it matches, the login and master password are shown (from another account — after 24 hours)."], "Kod yuboriş": ["Отправить код", "Send code"], "Gmail manzili notöğri": ["Неверный адрес Gmail", "Invalid Gmail address"], "Juda köp urinish, keyinroq": ["Слишком много попыток, позже", "Too many attempts, try later"], "Bu manzil boşqa seyfga ulangan": ["Этот адрес привязан к другому сейфу", "This address is linked to another vault"], "Pochta hali sozlanmagan": ["Почта ещё не настроена", "Email isn't set up yet"], "Yuborib bölmadi": ["Не удалось отправить", "Couldn't send"], "📧 Gmail orqali tiklaş yoqildi": ["📧 Восстановление через Gmail включено", "📧 Gmail recovery is on"], "Kod notöğri": ["Неверный код", "Wrong code"], "Kod eskirgan, qayta yuboring": ["Код устарел, отправьте заново", "The code has expired, send a new one"], "📧 Gmail orqali tiklaş": ["📧 Восстановление через Gmail", "📧 Gmail recovery"], "Gmail'dagi kod": ["Код из Gmail", "Code from Gmail"], "Ma'lumotlarni pasportdagidek yozing. Maxfiy sözni faqat siz biladigan qilib tanlang: tiklaş xavfsizligi şunga boğliq. Bu ma'lumotlar serverga yuborilmaydi.": ["Пишите данные как в паспорте. Секретное слово выберите такое, которое знаете только вы: от него зависит безопасность восстановления. Эти данные не отправляются на сервер.", "Write the details as in your passport. Pick a secret word only you know: recovery security depends on it. These details are not sent to the server."], "📧 Gmail orqali tiklaşni yoqiş": ["📧 Включить восстановление через Gmail", "📧 Turn on Gmail recovery"], "Master parol ham, tiklaş kaliti ham yöqolsa, seyfni Gmail kodi, familiya, ism, otasining ismi, tuğilgan sana va maxfiy söz bilan qaytarasiz. Tiklaş 7 kun kutişdan keyin oçiladi, şu vaqtda Telegram va Gmail'ga ogohlantiriş boradi.": ["Если потеряны и мастер-пароль, и ключ восстановления, сейф вернёте кодом из Gmail, фамилией, именем, отчеством, датой рождения и секретным словом. Сейф откроется через 7 дней ожидания, за это время в Telegram и Gmail придёт предупреждение.", "If both the master password and the recovery key are lost, you can restore the vault with a Gmail code, surname, first name, patronymic, date of birth and the secret word. The vault opens after a 7-day wait, during which a warning is sent to Telegram and Gmail."], "⚠️ Bu usul yoqilsa, Gmail'ingizga kira oladigan va şu ma'lumotlarni biladigan odam ham 7 kundan keyin seyfni oça oladi. Maxfiy sözni hec kimga aytmang.": ["⚠️ Если включить этот способ, человек с доступом к вашему Gmail и знающий эти данные тоже сможет открыть сейф через 7 дней. Никому не говорите секретное слово.", "⚠️ With this method on, someone who can get into your Gmail and knows these details could also open the vault after 7 days. Never tell anyone the secret word."], "Yuborilmoqda…": ["Отправка…", "Sending…"], "Tiklaş so'rovini yuboriş": ["Отправить запрос на восстановление", "Send recovery request"], "So'rov qabul qilindi": ["Запрос принят", "Request accepted"], "Ma'lumotlar mos kelmadi": ["Данные не совпали", "The details didn't match"], "📧 Seyfni tiklaş": ["📧 Восстановить сейф", "📧 Restore the vault"], "Agar bu manzil seyfga ulangan bölsa, unga kod yuborildi (Spam papkasini ham tekşiring).": ["Если этот адрес привязан к сейфу, на него отправлен код (проверьте и папку «Спам»).", "If this address is linked to a vault, a code was sent to it (check the Spam folder too)."], "📧 Gmail va şaxsiy ma'lumotlar bilan tiklaş": ["📧 Восстановление через Gmail и личные данные", "📧 Recovery with Gmail and personal details"], "Seyfga ulangan Gmail'ingizni kiriting. Ma'lumotlar tögri bölsa, xavfsizlik uçun 7 kundan keyin seyf oçiladi (yangi akkaunt bölsa, şu akkauntga köçadi).": ["Введите Gmail, привязанный к сейфу. Если данные верны, ради безопасности сейф откроется через 7 дней (если аккаунт новый — перейдёт в этот аккаунт).", "Enter the Gmail linked to the vault. If the details are correct, for security the vault opens after 7 days (if it's a new account, it moves to this account)."], "Yangi master parol": ["Новый мастер-пароль", "New master password"], "Yangi parolni takrorlang": ["Повторите новый пароль", "Repeat the new password"], "Seyfni oçiş": ["Открыть сейф", "Open the vault"], "Yangi parol kamida 10 belgi va murakkab bölsin": ["Новый пароль — не менее 10 символов и сложный", "The new password must be at least 10 characters and complex"], "Juda köp urinish, 24 soatdan keyin": ["Слишком много попыток, через 24 часа", "Too many attempts, try in 24 hours"], "Hali vaqti kelmadi": ["Время ещё не пришло", "It's not time yet"], "📧 Seyfni oçiş": ["📧 Открыть сейф", "📧 Open the vault"], "Oçilgandan keyin sizga yangi tiklaş kaliti beriladi.": ["После открытия вы получите новый ключ восстановления.", "After opening you'll get a new recovery key."], "Tiklaş": ["Восстановить", "Recover"], "Tiklaş kaliti notöğri": ["Неверный ключ восстановления", "Wrong recovery key"], "Yangi master parol örnatildi": ["Новый мастер-пароль установлен", "New master password set"], "Seyfni tiklaş": ["Восстановить сейф", "Restore the vault"], "Tiklaş kaliti 32 belgidan ibor     try { tg.setHeaderColor("bg_color"); } catch (_) {}
  }

  // ------------------------------------------------------------ yordamchilar
  function el(tag, attrs, ...kids) {
    const n = document.createElement(tag);
    if (attrs) for (const [k, v] of Object.entries(attrs)) {
      if (v == null || v === false) continue;
      if (k === "class") n.className = v;
      else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, v === true ? "" : v);
    }
    for (const c of kids.flat()) if (c != null && c !== false) n.append(c.nodeType ? c : String(c));
    return n;
  }
  function toast(msg) {
    const t = $("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toast._t);
    toast._t = setTimeout(() => t.classList.remove("show"), 2200);
  }
  function fmtBytes(n) {
    if (!n || n < 1024) return (n || 0) + " B";
    const u = ["KB", "MB", "GB", "TB"]; let v = n / 1024, i = 0;
    while (v >= 1024 && i < u.length - 1) { v /= 1024; i++; }
    return (v < 10 ? v.toFixed(1) : Math.round(v)) + " " + u[i];
  }
  function fmtDate(iso) {
    const d = new Date(iso);
    const p = new Intl.DateTimeFormat("en-GB", { timeZone: "Asia/Tashkent", year: "numeric", month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit", hourCycle: "h23" })
      .formatToParts(d).reduce((a, x) => (a[x.type] = x.value, a), {});
    const now = new Date();
    const sameYear = String(now.getFullYear()) === p.year;
    if (LANG !== "uz") {
      return new Intl.DateTimeFormat(LANG === "ru" ? "ru-RU" : "en-GB", { timeZone: "Asia/Tashkent", day: "numeric", month: "long",
        ...(sameYear ? {} : { year: "numeric" }), hour: "2-digit", minute: "2-digit", hourCycle: "h23" }).format(d);
    }
    return `${Number(p.day)}-${MONTHS[Number(p.month) - 1]}${sameYear ? "" : " " + p.year}, ${p.hour}:${p.minute}`;
  }
  function fmtDur(s) {
    if (!s) return "";
    const m = Math.floor(s / 60), r = s % 60;
    return `${m}:${String(r).padStart(2, "0")}`;
  }
  function openLink(url) {
    if (tg && /^https:\/\/t\.me\//.test(url)) tg.openTelegramLink(url);
    else if (tg) tg.openLink(url);
    else window.open(url, "_blank", "noopener");
  }

  async function api(path, opts = {}) {
    const res = await fetch(API + path, {
      method: opts.method || "GET",
      headers: { Authorization: "tma " + initData, ...(opts.body ? { "Content-Type": "application/json" } : {}) },
      body: opts.body ? JSON.stringify(opts.body) : undefined,
    });
    let data = null;
    try { data = await res.json(); } catch (_) {}
    if (!res.ok) { const e = new Error((data && data.error) || "HTTP " + res.status); e.status = res.status; e.data = data; throw e; }
    return data;
  }

  // ------------------------------------------------------------ Telegram formatlash (entities)
  // Ofsetlar UTF-16 birliklarda — JS satrlari ham UTF-16, shuning uchun to'g'ridan-to'g'ri kesamiz.
  function renderText(text, entities) {
    const root = el("div", { class: "text" });
    if (!text) return root;
    const ents = (entities || []).filter((e) => e && e.length > 0 && e.offset >= 0 && e.offset + e.length <= text.length);
    const points = new Set([0, text.length]);
    for (const e of ents) { points.add(e.offset); points.add(e.offset + e.length); }
    const cuts = [...points].sort((a, b) => a - b);
    for (let i = 0; i < cuts.length - 1; i++) {
      const a = cuts[i], b = cuts[i + 1];
      const piece = text.slice(a, b);
      const active = ents.filter((e) => e.offset <= a && e.offset + e.length >= b).sort((x, y) => y.length - x.length);
      let node = document.createTextNode(piece);
      for (const e of active.reverse()) node = wrap(e, node, piece);
      root.append(node);
    }
    return root;
  }
  function safeUrl(u) {
    try { const x = new URL(u); return /^(https?|tg):$/.test(x.protocol) ? x.href : null; } catch (_) { return null; }
  }
  function wrap(e, inner, piece) {
    const t = e.type;
    if (t === "bold") return el("b", null, inner);
    if (t === "italic") return el("i", null, inner);
    if (t === "underline") return el("u", null, inner);
    if (t === "strikethrough") return el("s", null, inner);
    if (t === "code") return el("code", null, inner);
    if (t === "pre") return el("pre", null, inner);
    if (t === "blockquote" || t === "expandable_blockquote") return el("blockquote", null, inner);
    if (t === "spoiler") { const s = el("span", { class: "spoiler" }, inner); s.onclick = () => s.classList.add("open"); return s; }
    if (t === "text_link" || t === "url") {
      const href = safeUrl(t === "url" ? (/^https?:/i.test(piece) ? piece : "https://" + piece) : e.url);
      if (!href) return inner;
      return el("a", { href, onclick: (ev) => { ev.preventDefault(); openLink(href); } }, inner);
    }
    if (t === "mention") {
      const href = "https://t.me/" + piece.replace(/^@/, "");
      return el("a", { href, onclick: (ev) => { ev.preventDefault(); openLink(href); } }, inner);
    }
    return inner;
  }

  // ------------------------------------------------------------ media
  const KIND_ICON = { document: "📄", audio: "🎵", voice: "🎙", video: "🎬", animation: "🎞", video_note: "⭕️", photo: "🖼" };
  const MSTATUS = {
    pending: "Arxivga yuklanmoqda…",
    too_big: "20 MB dan katta — hozirça faqat Telegramda",
    over_quota: "Media limiti tögan",
    failed: "Saqlab bölmadi",
  };

  const urlCache = new Map();
  async function mediaUrl(id, download) {
    const key = id + (download ? ":d" : "");
    const c = urlCache.get(key);
    if (c && c.exp > Date.now()) return c.url;
    const r = await api(`/media?id=${encodeURIComponent(id)}${download ? "&download=1" : ""}`);
    urlCache.set(key, { url: r.url, exp: Date.now() + (r.expires_in - 60) * 1000 });
    return r.url;
  }

  const io = "IntersectionObserver" in window ? new IntersectionObserver((list) => {
    for (const en of list) if (en.isIntersecting) { io.unobserve(en.target); en.target._load && en.target._load(); }
  }, { rootMargin: "300px" }) : null;

  function mediaBox(m, single, link) {
    const visual = ["photo", "video", "animation", "video_note"].includes(m.kind);
    if (m.status !== "stored") {
      const box = el("div", { class: "m" + (visual ? "" : " file") });
      if (visual) box.append(el("div", { class: "act" }, el("span", null, KIND_ICON[m.kind] || "📎"), el("span", { class: "note" }, MSTATUS[m.status] || m.status),
        m.status === "too_big" ? el("button", { class: "pill", onclick: () => openLink(link) }, "Telegramda oçiş") : null));
      else box.append(el("div", { class: "ico" }, KIND_ICON[m.kind] || "📎"),
        el("div", null, el("div", { class: "nm" }, m.file_name || m.kind), el("div", { class: "sz note" }, MSTATUS[m.status] || m.status)), el("span"));
      return box;
    }
    if (m.kind === "photo") {
      const box = el("div", { class: "m" }, el("span", { class: "note" }, "…"));
      if (m.width && m.height && single) box.style.aspectRatio = `${m.width} / ${m.height}`;
      box._load = async () => {
        try {
          const url = await mediaUrl(m.id);
          const img = el("img", { src: url, alt: "", loading: "lazy" });
          img.onclick = () => openLink(url);
          box.replaceChildren(img);
        } catch (_) { box.replaceChildren(el("span", { class: "note" }, "Rasm oçilmadi")); }
      };
      io ? io.observe(box) : box._load();
      return box;
    }
    if (visual) {
      const box = el("div", { class: "m" });
      if (m.width && m.height && single) box.style.aspectRatio = `${m.width} / ${m.height}`;
      const play = el("button", { class: "act" }, el("b", null, "▶ Körish"), el("span", { class: "note" }, [fmtDur(m.duration), fmtBytes(m.size)].filter(Boolean).join(" · ")));
      play.onclick = async () => {
        play.disabled = true;
        try {
          const url = await mediaUrl(m.id);
          const v = el("video", { src: url, controls: true, playsinline: true, autoplay: true, loop: m.kind === "animation" ? true : null, muted: m.kind === "animation" ? true : null });

      return box;
    }
    if (m.kind === "audio" || m.kind === "voice") {
      const box = el("div", { class: "m file" }, el("div", { class: "ico" }, KIND_ICON[m.kind]),
        el("div", { style: "min-width:0;width:100%" }, el("div", { class: "nm" }, m.file_name || (m.kind === "voice" ? "Ovozli xabar" : "Audio")),
          el("div", { class: "sz note" }, [fmtDur(m.duration), fmtBytes(m.size)].filter(Boolean).join(" · "))),
        el("button", { class: "pill" }, "▶"));
      box.lastChild.onclick = async () => {
        try {
          const url = await mediaUrl(m.id);
          box.replaceChildren(el("audio", { src: url, controls: true, autoplay: true }));
        } catch (_) { toast("Audio oçilmadi"); }
      };
      return box;
    }
    // hujjat
    const box = el("div", { class: "m file" }, el("div", { class: "ico" }, KIND_ICON.document),
      el("div", { style: "min-width:0;width:100%" }, el("div", { class: "nm" }, m.file_name || "Fayl"), el("div", { class: "sz note" }, fmtBytes(m.size))),
      el("button", { class: "pill" }, "Yuklaş"));
    box.lastChild.onclick = async () => {
      try {
        const url = await mediaUrl(m.id, true);
        if (tg && tg.downloadFile && tg.isVersionAtLeast && tg.isVersionAtLeast("8.0")) tg.downloadFile({ url, file_name: m.file_name || "fayl" });
        else openLink(url);

  }

  // ------------------------------------------------------------ postlar
  // Albom (media_group_id) postlarini bitta kartaga birlaştiramiz
  function groupPosts(posts) {
    const out = [];
    for (const p of posts) {
      const last = out[out.length - 1];
      if (last && p.media_group_id && last.media_group_id === p.media_group_id && last.channel_id === p.channel_id) {
        last.media = [...p.media, ...last.media];
        if (!last.text && p.text) { last.text = p.text; last.entities = p.entities; }
        last.edit_count += p.edit_count;
        last.parts.push(p);
      } else out.push({ ...p, media: [...p.media], parts: [p] });
    }
    return out;
  }

  function postCard(p) {
    const media = p.media.filter((m) => m.kind !== "thumb");
    const single = media.length === 1;
    const meta = el("div", { class: "meta" },
      state.channel ? null : el("span", { class: "ch" }, p.channel_title || "Kanal"),

    return el("div", { class: "empty" }, el("div", { style: "font-size:40px" }, "⏳"), el("h2", null, "Arxiv hozirça böş"), el("div", null, "Kanalga yangi post çiqsa, u şu yerda saqlanadi."));

  async function loadPosts(reset) {

  // ============================================================ SEYF (telefonda shifrlash)
  // Kalit tuzilmasi: tasodifiy 256-bit DEK yozuv va fayllarni shifrlaydi. DEK serverga faqat o'ralgan holda boradi:
  //   wrapped_key          = AES-GCM(KEK = PBKDF2-SHA256(master parol, salt, 600 000), DEK)
  //   recovery_wrapped_key = AES-GCM(PBKDF2-SHA256(tiklash kaliti, recovery_salt, 600 000), DEK)
  // Server, admin yoki Supabase ochiq parolni ham, DEK'ni ham ko'rmaydi.
  const te = new TextEncoder(), td = new TextDecoder();
  const ITER = 600000;
  const AUTOLOCK_MS = 5 * 60 * 1000;
  const CHUNK = 4 * 1024 * 1024;
  const B64 = {
    enc(u8) { let s = ""; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); },
    dec(s) { const b = atob(s); const u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; },
  };
  const rand = (n) => crypto.getRandomValues(new Uint8Array(n));
  async function kdf(secret, saltB64, iterations) {
    const base = await crypto.subtle.importKey("raw", te.encode(secret), "PBKDF2", false, ["deriveKey"]);
    return crypto.subtle.deriveKey({ name: "PBKDF2", hash: "SHA-256", salt: B64.dec(saltB64), iterations }, base, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
  }
  async function seal(key, plain, aad) {
    const iv = rand(12);
    const ct = new Uint8Array(await crypto.subtle.encrypt({ name: "AES-GCM", iv, additionalData: te.encode(aad) }, key, plain));
    const out = new Uint8Array(12 + ct.length); out.set(iv); out.set(ct, 12);
    return out;
  }
  async function unseal(key, box, aad) {
    return new Uint8Array(await crypto.subtle.decrypt({ name: "AES-GCM", iv: box.subarray(0, 12), additionalData: te.encode(aad) }, key, box.subarray(12)));
  }
  const importDek = (raw) => crypto.subtle.importKey("raw", raw, { name: "AES-GCM" }, false, ["encrypt", "decrypt"]);
  const RK_ABC = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  function newRecoveryKey() {
    let bits = 0, val = 0, out = "";
    for (const b of rand(20)) { val = ((val << 8) | b) & 0xffff; bits += 8; while (bits >= 5) { out += RK_ABC[(val >>> (bits - 5)) & 31]; bits -= 5; } }
    return out.match(/.{4}/g).join("-");
  }
  const normRK = (s) => String(s || "").toUpperCase().replace(/[^A-Z0-9]/g, "");

  function strength(pw) {
    let s = 0;
    if (pw.length >= 10) s++; if (pw.length >= 14) s++; if (pw.length >= 18) s++;
    if (/[a-z]/.test(pw) && /[A-Z]/.test(pw)) s++; if (/\d/.test(pw)) s++; if (/[^A-Za-z0-9]/.test(pw)) s++;
    return Math.min(4, Math.floor(s * 4 / 6));

          out.push({ id: it.id, kind: it.kind, f, updated_at: it.updated_at, fromBot: true });
          migrate.push({ id: it.id, kind: it.kind, f });
        } catch (_) { out.push({ id: it.id, kind: it.kind, f: { title: "⚠️ Botdan kelgan yozuv oçilmadi" }, broken: true, updated_at: it.updated_at }); }

      }
      try {
        const data = JSON.parse(td.decode(await unseal(V.dek, B64.dec(it.data), "qq:item:" + it.kind)));
        out.push({ id: it.id, kind: it.kind, f: data.f || {}, updated_at: it.updated_at });
      } catch (_) { out.push({ id: it.id, kind: it.kind, f: { title: "⚠️ Oçilmadi" }, broken: true, updated_at: it.updated_at }); }
    }
    V.items = out;
    renderVault();
    for (const m of migrate) {
      try {
        const data = B64.enc(await seal(V.dek, te.encode(JSON.stringify({ v: 1, f: m.f })), "qq:item:" + m.kind));
        await api("/vault/item", { method: "POST", body: { id: m.id, kind: m.kind, data } });
      } catch (e) { console.error("migrate", e); }
    }
  }

        const { d, lookup } = await idDerive(a);
        const r = await api("/idrec/recover", { method: "POST", body: { lookup } });
        const key = await idKeyRaw(d, r.pepper);
        const data = JSON.parse(td.decode(await unseal(await importDek(key), B64.dec(r.blob), "qq:idrec")));

  function loginSignInFlow(preLogin, prePass) {
    const lg = el("input", { class: "inp", placeholder: "Login", autocomplete: "username", autocapitalize: "none", spellcheck: "false", value: preLogin || "" });

      const done = busy(b, "Tekşirilmoqda…");
      try {
        const s1 = await api("/auth/salt", { method: "POST", body: { login } });
        const proof = await pbkdfHex(pw.inp.value, B64.dec(s1.salt), s1.iterations || ITER);
        await api("/auth/login", { method: "POST", body: { login, proof } });
        await loadKeys();

  // ============================================================ YUZ va BIOMETRIYA
  // 1) Face ID / barmoq izi bilan ochish: tasodifiy kalit Telegram'ning biometrik xotirasida, serverda shu kalit bilan o'ralgan DEK.
  const BM = () => (tg && tg.BiometricManager && tg.isVersionAtLeast && tg.isVersionAtLeast("7.2")) ? tg.BiometricManager : null;
  let bmReady = null;
  function bmInit() {
    const bm = BM();
    if (!bm) return Promise.resolve(null);
    if (!bmReady) bmReady = new Promise((res) => { try { bm.init(() => res(bm)); } catch (_) { res(null); } setTimeout(() => res(bm.isInited ? bm : null), 3000); });
    return bmReady;
  }
  const bioName = (bm) => bm && bm.biometricType === "finger" ? "barmoq izi" : "Face ID";
  async function bioAvailable() { const bm = await bmInit(); return bm && bm.isBiometricAvailable ? bm : null; }
  async function bioEnable() {
    const bm = await bioAvailable();
    if (!bm) return toast("Bu telefonda Face ID / barmoq izi Telegram orqali mavjud emas");
    if (!V.dek) return toast("Avval seyfni oçing");
    if (!bm.isAccessGranted) {

  // 2) Yuz bilan tiklash: kamera → jonlilik tekshiruvi (to'g'ri, chapga, o'ngga) → 128 sonli yuz andozasi (face-api, telefonda)
  const FACE_JS = "https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.15/dist/face-api.js";
  const FACE_MODELS = "https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.15/model";
  let faceLib = null;
  async function loadFace() {
    if (faceLib) return faceLib;
    if (!window.faceapi) await new Promise((res, rej) => { const sc = document.createElement("script"); sc.src = FACE_JS; sc.onload = res; sc.onerror = () => rej(new Error("face_load")); document.head.append(sc); });
    const fa = window.faceapi;
    if (!(await fa.tf.setBackend("webgl").catch(() => false))) await fa.tf.setBackend("cpu");
    await fa.tf.ready();
    await Promise.all([fa.nets.tinyFaceDetector.loadFromUri(FACE_MODELS), fa.nets.faceLandmark68Net.loadFromUri(FACE_MODELS), fa.nets.faceRecognitionNet.loadFromUri(FACE_MODELS)]);
    faceLib = fa;
    return fa;
  }
  const fdist = (a, b) => Math.sqrt(a.reduce((s, v, i) => s + (v - b[i]) ** 2, 0));
  // Bosh holati 68 nuqtadan: yaw (chap/o'ng) va pitch (tepa/past). Kamera kadri ko'zgulanmagan:
  // odam o'z CHAPiga qarasa, burun rasmda o'ngga siljiydi → yaw > 0.
  function poseOf(lm) {
    const p = lm.positions, le = p[36], re = p[45], n = p[30], chin = p[8];
    const eyeY = (p[36].y + p[39].y + p[42].y + p[45].y) / 4, eyeX = (le.x + re.x) / 2;
    return { yaw: (n.x - eyeX) / Math.max(1, re.x - le.x), pitch: (n.y - eyeY) / Math.max(1, chin.y - eyeY) };
  }
  function avgDesc(list) { const out = new Array(128).fill(0); for (const d of list) for (let i = 0; i < 128; i++) out[i] += d[i] / list.length; return out; }
  const MOVE_TEXT = { up: "⬆️ Tepaga qarang", down: "⬇️ Pastga qarang", left: "⬅️ Çapga qarang", right: "➡️ Önga qarang" };

  /**
   * Jonlilik tekshiruvi (holat mashinasi, kameradan mustaqil — sinovlanadi):
   * 3 ta to'g'ri kadr → tasodifiy tartibda tepaga/pastga/chapga/o'ngga (har biridan keyin yana to'g'ri) → oxirgi to'g'ri kadr.
   * Oddiy rasm boshini burolmaydi; oldindan yozilgan video tasodifiy tartibga mos kelmaydi; har harakat 12 soniyada bo'lishi kerak.
   * Har kadrdagi yuz boshidagi yuz bilan bir xil bo'lishi shart (boshqa odam yoki rasm almashtirilsa — to'xtaydi).
   */
  function makeLiveness(order, now = () => Date.now()) {
    const st = { stage: "base", base: [], pitch0: 0, i: 0, need: order.slice(), t: now(), done: false, fail: null };
    const center = (q) => Math.abs(q.yaw) < 0.12 && Math.abs(q.pitch - st.pitch0) < Math.max(0.04, st.pitch0 * 0.1);
    const hit = (m, q) => m === "left" ? q.yaw > 0.22 : m === "right" ? q.yaw < -0.22
      : m === "up" ? q.pitch < st.pitch0 * 0.82 && Math.abs(q.yaw) < 0.25 : q.pitch > st.pitch0 * 1.18 && Math.abs(q.yaw) < 0.25;
    function text() {
      if (st.stage === "base") return "Yuzingizni doira içiga oling va töğriga qarang";
      if (st.stage === "move") return MOVE_TEXT[st.need[st.i]];
      if (st.stage === "center") return "Endi yana töğriga qarang";
      return "";
    }
    function step(q, d) {
      if (st.done || st.fail) return st;
      if (now() - st.t > 12000) { st.fail = "timeout"; return st; }
      if (st.base.length >= 3 && fdist(d, avgDesc(st.base)) > 0.6) return st; // boshqa yuz — kadr hisoblanmaydi
      if (st.stage === "base") {
        if (Math.abs(q.yaw) < 0.1) { st.base.push(d); st.pitch0 = (st.pitch0 * (st.base.length - 1) + q.pitch) / st.base.length; }
        if (st.base.length >= 3) { st.stage = "move"; st.t = now(); }
      } else if (st.stage === "move") {
        if (hit(st.need[st.i], q)) { st.i++; st.stage = "center"; st.t = now(); }
      } else if (st.stage === "center") {
        if (center(q)) {
          if (st.i >= st.need.length) {
            if (fdist(d, avgDesc(st.base)) > 0.45) return st;
            st.final = avgDesc([...st.base, d]); st.done = true;
          } else { st.stage = "move"; st.t = now(); }
        }
      }
      return st;
    }
    return { st, step, text };
  }
  window.__qqLive = makeLiveness; // sinov uchun
  function shuffled(a) { const r = crypto.getRandomValues(new Uint32Array(a.length)); return a.map((x, i) => [r[i], x]).sort((p, q) => p[0] - q[0]).map((x) => x[1]); }

  /** Jonli yuz tekshiruvi. Natija: 128 sonli andoza (o'rtacha) yoki xato. */
  function faceCapture(title, hint) {
    if (window.__qqFaceMock) return window.__qqFaceMock();
    return new Promise((resolve, reject) => {
      const video = el("video", { autoplay: true, playsinline: true, muted: true });
      const ring = el("div", { class: "ring" });
      const msg = el("div", { class: "info", style: "text-align:center;font-size:17px;font-weight:600;color:var(--text)" }, "Model yuklanmoqda… (bir marta, ~7 MB)");
      const steps = el("div", { class: "steps" }, [0, 1, 2, 3].map(() => el("i")));
      let stream = null, stopped = false, timer = null;
      const stop = () => { stopped = true; clearInterval(timer); if (stream) stream.getTracks().forEach((t) => t.stop()); };
      const cancel = el("button", { class: "btn sec" }, "Bekor qiliş");
      cancel.onclick = () => { stop(); closeSheet(); reject(new Error("cancel")); };
      openSheet(el("h3", null, title), hint ? el("div", { class: "note", style: "margin:-6px 0 10px" }, hint) : null,
        el("div", { class: "cam" }, video, ring), steps, msg, cancel);
      (async () => {
        let fa;
        try {
          [fa, stream] = await Promise.all([loadFace(), navigator.mediaDevices.getUserMedia({ video: { facingMode: "user", width: { ideal: 640 } }, audio: false })]);
        } catch (e) {
          stop(); closeSheet();
          return reject(new Error(e && e.message === "face_load" ? "face_load" : "camera"));
        }
        if (stopped) { stream.getTracks().forEach((t) => t.stop()); return; }
        video.srcObject = stream;
        const live = makeLiveness(shuffled(["up", "down", "left", "right"]));
        msg.textContent = live.text();
        let busyF = false;
        const opts = new fa.TinyFaceDetectorOptions({ inputSize: 320, scoreThreshold: 0.5 });
        timer = setInterval(async () => {
          if (busyF || stopped || video.readyState < 2) return;
          busyF = true;
          try {
            const r = await fa.detectSingleFace(video, opts).withFaceLandmarks().withFaceDescriptor();
            if (!r || r.detection.score < 0.6) { ring.classList.remove("ok"); if (Date.now() - live.st.t > 12000) live.st.fail = "timeout"; }
            else { ring.classList.add("ok"); live.step(poseOf(r.landmarks), Array.from(r.descriptor)); }
            [...steps.children].forEach((x, i) => x.classList.toggle("on", i < live.st.i));
            msg.textContent = live.text();
            if (live.st.fail) { stop(); closeSheet(); reject(new Error(live.st.fail)); }
            else if (live.st.done) { stop(); closeSheet(); resolve(live.st.final); }
          } catch (_) { /* keyingi kadr */ } finally { busyF = false; }
        }, 200);
      })();
    });
  }

      if (f.enc_meta && !F.metas.has(f.id)) {
        try {
          if (String(f.enc_meta).startsWith("pk1.")) { if (V.priv) F.metas.set(f.id, JSON.parse(td.decode(await pkOpen(f.enc_meta.slice(4))))); }
          else F.metas.set(f.id, JSON.parse(td.decode(await unseal(V.dek, B64.dec(f.enc_meta), "qq:meta"))));
        } catch (_) {}
      }
      if (f.enc_key && V.priv && !F.keys.has(f.id)) {
        try { F.keys.set(f.id, await importDek(await pkOpen(f.enc_key))); } catch (_) {}
      }
    }
    renderFiles();
  }
  const FKIND = { photo: "🖼", video: "🎬", animation: "🎞", audio: "🎵", voice: "🎙", video_note: "⭕️", document: "📄", file: "📄" };
  const SECS = [["all", "Barçasi"], ["photo", "🖼 Rasmlar"], ["video", "🎬 Videolar"], ["audio", "🎵 Audio"], ["doc", "📄 Hujjatlar"]];
  function secOf(f) {
    const m = F.metas.get(f.id) || {};
    const mime = m.mime || f.mime || "", kind = m.kind || f.kind;
    if (kind === "photo" || /^image\//.test(mime)) return "photo";
    if (["video", "animation", "video_note"].includes(kind) || /^video\//.test(mime)) return "video";
    if (["audio", "voice"].includes(kind) || /^audio\//.test(mime)) return "audio";
    return "doc";
  }
  function fileName(f) {
    const m = F.metas.get(f.id);
    if (m && m.name) return m.name;
    if (f.file_name) return f.file_name;
    if (f.enc_meta && !m) return "🔒 Şifrlangan fayl";
    const kind = (m && m.kind) || f.kind;
    return ({ photo: "Rasm", video: "Video", animation: "GIF", audio: "Audio", voice: "Ovozli xabar", video_note: "Video xabar" }[kind] || "Fayl") + " · " + fmtDate(f.created_at);
  }
  function fileSub(f) {
    const st = { tg_only: "Telegram bulutida (20 MB dan katta)", pending: "nusxasi yozilmoqda…", stored: "zaxira nusxa", failed: "nusxa olinmadi",
      ready: "🔒 şifrlangan", await_key: "şifrlaşni kutyapti", encrypting: "şifrlanmoqda…" }[f.status] || f.status;
    return [f.size ? fmtBytes(f.size) : null, fmtDate(f.created_at), st].filter(Boolean).join(" · ");
  }
  function lockedFiles() {
    return el("div", { class: "lockbox" }, el("div", { class: "big" }, "🔒"), el("h2", null, "Fayllar seyf içida"),
      el("p", null, "Rasm, video va hujjatlarni körish uçun seyfni master parol bilan oçing."),
      el("button", { class: "btn", onclick: () => switchTab("vault") }, "🔐 Seyfni oçiş"));
  }
  // Rasm katakchasi: bosilganda emas, ko'ringanda o'zi ochiladi (ketma-ket, 2 tadan)
  const thumbQ = []; let thumbBusy = 0;
  function pumpThumbs() {
    while (thumbBusy < 2 && thumbQ.length) {
      const [f, img] = thumbQ.shift();
      thumbBusy++;
      decryptFile(f).then((blob) => { const u = URL.createObjectURL(blob); F.urls.set(f.id, u); img.src = u; })
        .catch(() => { img.alt = "⚠️"; }).finally(() => { thumbBusy--; pumpThumbs(); });
    }
  }
  function photoTile(f) {
    const img = el("img", { alt: "", loading: "lazy" });
    const tile = el("button", { class: "m", style: "min-height:0;aspect-ratio:1", onclick: () => fileActions(f) }, img);
    if (F.urls.has(f.id)) img.src = F.urls.get(f.id);
    else if (f.encrypted && f.status === "ready" && (F.keys.has(f.id) || !String(f.enc_meta || "").startsWith("pk1."))) { thumbQ.push([f, img]); }
    else tile.replaceChildren(el("div", { class: "act" }, el("div", { style: "font-size:26px" }, "🖼"), el("span", null, fileSub(f))));
    return tile;
  }
  function renderFiles() {
    const box = $("tabFiles");
    if (cur === "files") $("fab").hidden = !V.dek;
    if (!V.dek) return box.replaceChildren(lockedFiles());
    if (!F.list) { box.replaceChildren(el("div", { class: "skel" }), el("div", { class: "skel" })); return; }
    const up = F.uploading.map((u) => el("div", { class: "item" }, el("div", { class: "ic" }, "⬆️"),
      el("div", { class: "grow" }, el("div", { class: "t" }, u.name), el("div", { class: "s" }, u.err ? "Xato: " + u.err : `Şifrlanib yuklanmoqda… ${Math.round(u.p * 100)}%`),
        el("div", { class: "progress" }, el("b", { style: `width:${Math.round(u.p * 100)}%` })))));
    const head = el("div", { class: "info", style: "margin-top:4px" },
      "📥 Rasm, video, fayl yoki matnni botga taşlang (bir vaqtda yuzlab bölsa ham) — özi şifrlanib, şu yerda bölimlarga joylanadi. Yoki pastdagi ⬆ tugmasi bilan yuklang.");
    const counts = { all: F.list.length }; for (const f of F.list) { const k = secOf(f); counts[k] = (counts[k] || 0) + 1; }
    const chips = el("div", { class: "chips" }, SECS.filter(([k]) => k === "all" || counts[k]).map(([k, label]) =>
      el("button", { class: "chip" + (F.sec === k ? " on" : ""), onclick: () => { F.sec = k; renderFiles(); } }, `${label} ${counts[k] || 0}`)));
    if (!F.list.length && !up.length) {
      return box.replaceChildren(head, el("div", { class: "empty" }, el("div", { style: "font-size:40px" }, "📁"), el("h2", null, "Hali fayl yöq"),
        el("div", null, "Rasm, video, hujjat — istalgan narsani botga taşlang.")));
    }
    const list = F.list.filter((f) => F.sec === "all" || secOf(f) === F.sec);
    thumbQ.length = 0;
    const body = F.sec === "photo"
      ? el("div", { class: "media", style: "grid-template-columns:repeat(3,1fr)" }, list.map(photoTile))
      : el("div", { class: "list" }, up, list.map((f) =>
        el("button", { class: "item", onclick: () => fileActions(f) },
          el("div", { class: "ic" }, FKIND[(F.metas.get(f.id) || {}).kind || f.kind] || "📄"),
          el("div", { class: "grow" }, el("div", { class: "t" }, fileName(f)), el("div", { class: "s" }, fileSub(f))))));
    box.replaceChildren(head, chips, body);
    pumpThumbs();
  }

  function fileActions(f) {
    const acts = [];
    const meta = F.metas.get(f.id) || {};
    if (f.encrypted && f.status === "ready") {
      const open = el("button", { class: "btn" }, "👁 Oçiş");
      open.onclick = async () => {
        const done = busy(open, "Şifr oçilmoqda…");
        try { const blob = await decryptFile(f, (p) => { open.textContent = `Şifr oçilmoqda… ${Math.round(p * 100)}%`; }); done(); previewBlob(f, blob); }
        catch (_) { done(); toast("Oçib bölmadi"); }
      };
      acts.push(open);
    } else if (f.status === "tg_only" || f.status === "stored" || f.status === "pending") {
      const send = el("button", { class: "btn" }, "📤 Bot çatiga yuboriş");
      send.onclick = async () => { const done = busy(send, "Yuborilmoqda…"); try { await api("/files/send", { method: "POST", body: { id: f.id } }); toast("Bot çatiga yuborildi (himoyalangan)"); closeSheet(); } catch (_) { toast("Yuborib bölmadi"); } done(); };
      acts.push(send);
      if (f.status === "stored") acts.push(el("button", { class: "btn sec", onclick: async () => {
        try { const r = await api(`/files/download?id=${f.id}&download=1`); if (tg && tg.downloadFile && tg.isVersionAtLeast && tg.isVersionAtLeast("8.0")) tg.downloadFile({ url: r.url, file_name: fileName(f) }); else openLink(r.url); }
        catch (_) { toast("Yuklab bölmadi"); } } }, "⬇️ Zaxira nusxani yuklaş"));
      if (f.status === "tg_only") acts.push(el("div", { class: "note", style: "margin-top:8px" }, "Fayl 20 MB dan katta: u Telegram bulutida turadi, bot uni faqat sizga himoyalangan holda qayta yuboradi."));
    } else {
      acts.push(el("div", { class: "info" }, f.status === "await_key" ? "Fayl şifrlaşni kutyapti — bir necha daqiqada tayyor böladi." : "Fayl tayyorlanmoqda…"));
    }
    const del = el("button", { class: "btn danger" }, "🗑 Öçiriş");
    del.onclick = async () => {
      if (del.dataset.sure !== "1") { del.dataset.sure = "1"; del.textContent = "Rostdan öçirilsinmi? Yana bir bosing"; return; }
      try { await api("/files/delete", { method: "POST", body: { id: f.id } }); closeSheet(); await loadFiles(); toast("Öçirildi"); } catch (_) { toast("Öçirib bölmadi"); }
    };
    acts.push(del);
    const caption = meta.caption || f.caption;
    openSheet(el("h3", null, fileName(f)), el("div", { class: "note", style: "margin:-6px 0 12px" }, fileSub(f) + (meta.source ? " · " + meta.source : "")),
      caption ? el("div", { class: "info", style: "margin-bottom:8px;white-space:pre-wrap" }, caption) : null, ...acts);
  }

  async function decryptFile(f, onp) {
    const meta = F.metas.get(f.id) || {};
    const key = F.keys.get(f.id) || V.dek;
    const parts = [];
    for (let i = 0; i < f.chunks; i++) {
      const r = await api(`/files/chunk_url?id=${f.id}&i=${i}&mode=get`);
      const res = await fetch(r.url);
      if (!res.ok) throw new Error("download");
      parts.push(await unseal(key, new Uint8Array(await res.arrayBuffer()), `qq:file:${f.id}:${i}:${f.chunks}`));
      onp && onp((i + 1) / f.chunks);
    }
    const mime = meta.mime || ({ photo: "image/jpeg", video: "video/mp4", animation: "video/mp4", video_note: "video/mp4", voice: "audio/ogg" }[meta.kind || f.kind]) || "application/octet-stream";
    return new Blob(parts, { type: mime });
  }
  function previewBlob(f, blob) {
    const meta = F.metas.get(f.id) || {};
    const url = F.urls.get(f.id) || URL.createObjectURL(blob);
    let view = null;
    if (/^image\//.test(blob.type)) view = el("img", { src: url });
    else if (/^video\//.test(blob.type)) view = el("video", { src: url, controls: true, playsinline: true });
    else if (/^audio\//.test(blob.type)) view = el("audio", { src: url, controls: true, style: "width:100%" });
    else if (/^text\/|json/.test(blob.type) && blob.size < 2e6) { view = el("pre"); blob.text().then((t) => { view.textContent = t; }); }
    const ext = ({ "image/jpeg": ".jpg", "video/mp4": ".mp4", "audio/ogg": ".ogg" })[blob.type] || "";
    const save = el("a", { class: "btn sec", href: url, download: meta.name || ("qora_quti_" + f.id + ext) }, "⬇️ Qurilmaga saqlaş");
    openSheet(el("h3", null, fileName(f)), el("div", { class: "preview" }, view || el("div", { class: "info" }, "Bu fayl turini şu yerda körsatib bölmaydi. Qurilmaga saqlang.")), save);
  }

  $("filePick").onchange = async (e) => {
    const files = [...e.target.files];
    e.target.value = "";
    if (!V.dek) { switchTab("vault"); return toast("Şifrlab yuklaş uçun avval Seyf'ni oçing"); }
    for (const file of files) await uploadEncrypted(file);
  };
  async function uploadEncrypted(file) {
    const u = { name: file.name, p: 0 };
    F.uploading.push(u); renderFiles();
    try {
      const chunks = Math.max(1, Math.ceil(file.size / CHUNK));
      if (file.size === 0) throw new Error("böş fayl");
      const meta = { name: file.name, mime: file.type || "application/octet-stream", size: file.size };
      const encMeta = B64.enc(await seal(V.dek, te.encode(JSON.stringify(meta)), "qq:meta"));
      let init;
      try { init = await api("/files/upload_init", { method: "POST", body: { size: file.size, chunks, chunk_size: CHUNK, enc_meta: encMeta } }); }
      catch (err) { throw new Error(err.message === "quota" ? "joy yetmaydi" : err.message); }
      const id = init.id;
      F.metas.set(id, meta);
      let next = 0, done = 0;
      const worker = async () => {
        while (next < chunks) {
          const i = next++;
          const plain = new Uint8Array(await file.slice(i * CHUNK, Math.min(file.size, (i + 1) * CHUNK)).arrayBuffer());
          const box = await seal(V.dek, plain, `qq:file:${id}:${i}:${chunks}`);
          const r = await api(`/files/chunk_url?id=${id}&i=${i}`);
          const put = await fetch(r.url, { method: "PUT", headers: { "Content-Type": "application/octet-stream", "x-upsert": "true" }, body: box });
          if (!put.ok) throw new Error("yuklaş " + put.status);
          done++; u.p = done / chunks; renderFiles();
        }
      };
      await Promise.all([worker(), worker()]);
      await api("/files/upload_done", { method: "POST", body: { id } });
      F.uploading = F.uploading.filter((x) => x !== u);
      toast("🔒 Şifrlab saqlandi");
      await loadFiles();
      loadMe().catch(() => {});
    } catch (err) {
      u.err = err.message || "xato"; renderFiles();
      setTimeout(() => { F.uploading = F.uploading.filter((x) => x !== u); renderFiles(); }, 6000);
    }
  }

  // ============================================================ TABLAR
  let cur = "vault";
  let channelsLoaded = false;
  function switchTab(t) {
    cur = t;
    for (const b of $("nav").querySelectorAll("button")) b.classList.toggle("on", b.dataset.tab === t);
    $("tabVault").hidden = t !== "vault";
    $("tabFiles").hidden = t !== "files";
    $("tabChannels").hidden = t !== "channels";
    $("chTools").hidden = t !== "channels";
    $("fab").hidden = !((t === "vault" || t === "files") && V.dek);
    $("fab").textContent = t === "files" ? "⬆" : "+";
    try { localStorage.setItem("qq_tab", t); } catch (_) {}
    if (t === "vault") renderVault();
    if (t === "files") { renderFiles(); if (V.dek) loadFiles().catch(() => toast("Fayllarni yuklab bölmadi")); }
    if (t === "channels" && !channelsLoaded) { channelsLoaded = true; loadPosts(true); }
    window.scrollTo(0, 0);
  }
  for (const b of $("nav").querySelectorAll("button")) b.onclick = () => switchTab(b.dataset.tab);

  // ------------------------------------------------------------ boshlash
  async function loadMe() {
    state.me = await api("/me");
    renderHeader();
  }

  async function boot() {
    if (!initData) {
      $("tabVault").replaceChildren(el("div", { class: "empty" }, el("div", { style: "font-size:40px" }, "🔒"), el("h2", null, "Telegram ichida oçing"),
        el("div", null, "Qora Quti faqat Telegram'dagi @qora_quti_bot orqali oçiladi.")));
      $("nav").hidden = true;
      return;
    }
    $("tabVault").replaceChildren(el("div", { class: "skel" }), el("div", { class: "skel" }));
    try {
      await Promise.all([loadMe(), loadKeys()]);
      try { V.transfer = await api("/recovery/status"); } catch (_) {}
    } catch (e) {
      $("tabVault").replaceChildren(el("div", { class: "empty" }, el("h2", null, e.status === 401 ? "Kiriş tasdiqlanmadi" : "Ulanib bölmadi"),
        el("div", null, e.status === 401 ? "Mini App'ni bot menyusidan qayta oçing." : "Birozdan keyin qayta urinib köring."),
        el("br"), el("button", { class: "cta", onclick: boot }, "Qayta urinish")));
      return;
    }
    if (state.me.channels.length === 1) state.channel = state.me.channels[0].id;
    renderHeader();
    let t = "vault";
    try { t = localStorage.getItem("qq_tab") || "vault"; } catch (_) {}
    if (location.hash === "#tiklash") t = "vault";
    switchTab(["vault", "files", "channels"].includes(t) ? t : "vault");
    if (location.hash === "#tiklash") { try { history.replaceState(null, "", location.pathname + location.search); } catch (_) {} idRecoverFlow(); }
  }
  boot();
})();
</script>
</body>
